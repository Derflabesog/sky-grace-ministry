<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Small Groups | Sky Grace Admin</title><script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"></head><body class="bg-slate-50 flex min-h-screen"><div id="admin-sidebar-mount"></div><script src="admin-sidebar.js" defer></script><div class="flex-1 min-w-0"><header class="h-16 bg-white border-b px-8 flex items-center justify-between sticky top-0 z-30"><div><h1 class="font-black">Small Groups & Cells</h1><p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Build community, discipleship and pastoral care</p></div><button onclick="exportGroups()" class="btn bg-green-600 text-white"><i class="fas fa-file-csv mr-2"></i>Export Groups</button></header>
<main class="p-6 lg:p-8 max-w-[1600px] mx-auto"><section class="grid xl:grid-cols-[390px_1fr] gap-7 items-start"><form id="groupForm" class="panel space-y-5 xl:sticky xl:top-24"><input id="editingId" type="hidden"><div><h2 class="text-xl font-black">Create Small Group</h2><p class="sub">Set the leader, schedule, location, and capacity.</p></div><div><label class="label">Group Name *</label><input id="groupName" required class="field" placeholder="e.g. Grace Family Cell"></div><div class="grid grid-cols-2 gap-4"><div><label class="label">Group Type *</label><select id="groupType" class="field"><option>Cell Group</option><option>Bible Study</option><option>Prayer Group</option><option>Youth Group</option><option>Men's Group</option><option>Women's Group</option><option>Couples Group</option></select></div><div><label class="label">Branch *</label><select id="branch" class="field"><option>Okahandja HQ</option><option>Windhoek</option><option>Online</option><option>Other</option></select></div></div><div><label class="label">Leader *</label><input id="leaderName" required class="field"></div><div><label class="label">Assistant Leader</label><input id="assistantLeader" class="field"></div><div class="grid grid-cols-2 gap-4"><div><label class="label">Meeting Day *</label><select id="meetingDay" class="field"><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option></select></div><div><label class="label">Meeting Time</label><input id="meetingTime" type="time" class="field"></div></div><div class="grid grid-cols-2 gap-4"><div><label class="label">Frequency</label><select id="meetingFrequency" class="field"><option>Weekly</option><option>Every Two Weeks</option><option>Monthly</option></select></div><div><label class="label">Maximum Members</label><input id="maximumMembers" type="number" min="1" class="field"></div></div><div><label class="label">Meeting Location *</label><input id="location" required class="field" placeholder="Home, church room or online"></div><div><label class="label">Description</label><textarea id="description" rows="2" class="field"></textarea></div><div><label class="label">Notes</label><textarea id="notes" rows="2" class="field"></textarea></div><p id="formStatus" class="hidden rounded-xl p-3 text-sm font-bold"></p><div class="flex gap-3"><button id="saveBtn" class="btn bg-violet-600 text-white flex-1"><i class="fas fa-people-roof mr-2"></i>Save Group</button><button type="button" onclick="resetForm()" class="btn bg-slate-100 text-slate-600">Clear</button></div></form>
<div><section class="grid sm:grid-cols-3 gap-4 mb-5"><div class="stat"><small>Total Groups</small><strong id="totalGroups">0</strong></div><div class="stat"><small>Active Groups</small><strong id="activeGroups" class="text-green-600">0</strong></div><div class="stat"><small>Group Memberships</small><strong id="totalMemberships" class="text-violet-600">0</strong></div></section><div class="grid md:grid-cols-[1fr_190px] gap-3 mb-4"><input id="searchBox" class="field" placeholder="Search group, leader, location..."><select id="statusFilter" class="field"><option value="all">All statuses</option><option>Active</option><option>Paused</option><option>Closed</option></select></div><p id="pageStatus" class="mb-4 text-sm font-bold text-slate-500">Loading groups...</p><div id="groupList" class="grid lg:grid-cols-2 gap-4"></div></div></section></main></div>
<div id="rosterModal" class="fixed inset-0 bg-slate-950/60 hidden items-center justify-center z-50 p-5"><div class="bg-white rounded-3xl w-full max-w-4xl max-h-[90vh] overflow-y-auto p-7 relative"><button onclick="closeRoster()" class="absolute right-6 top-6 text-slate-400"><i class="fas fa-times text-xl"></i></button><h2 id="rosterTitle" class="text-2xl font-black">Group Roster</h2><p id="rosterMeta" class="sub mt-1"></p><form id="memberForm" class="grid md:grid-cols-[1fr_190px_auto] gap-3 mt-6"><select id="memberId" required class="field"><option value="">Select member</option></select><select id="memberRole" class="field"><option>Member</option><option>Assistant Leader</option><option>Secretary</option><option>Host</option><option>Prayer Coordinator</option></select><button class="btn bg-violet-600 text-white"><i class="fas fa-user-plus mr-2"></i>Add</button></form><p id="rosterStatus" class="mt-4 text-sm font-bold"></p><div id="rosterList" class="mt-5 space-y-3"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase.js"></script><script src="assets/js/guard.js"></script><style>.panel,.stat,.group-card{background:#fff;border:1px solid #e2e8f0;border-radius:1rem;padding:1.25rem}.label,.stat small{display:block;margin-bottom:.4rem;font-size:.61rem;font-weight:900;text-transform:uppercase;letter-spacing:.1em;color:#94a3b8}.field{width:100%;background:#f8fafc;border:1px solid #e2e8f0;border-radius:.75rem;padding:.78rem .95rem;font-size:.78rem;font-weight:700}.btn{border-radius:.75rem;padding:.78rem 1rem;font-size:.67rem;font-weight:900;text-transform:uppercase;letter-spacing:.06em}.sub{font-size:.75rem;color:#64748b}.stat strong{display:block;font-size:1.5rem;margin-top:.4rem}.badge{padding:.35rem .65rem;border-radius:99px;font-size:.56rem;font-weight:900;text-transform:uppercase}</style>
<script>
let groups=[],memberships=[],members=[],selectedGroup=null;const el=id=>document.getElementById(id);document.addEventListener("DOMContentLoaded",()=>{el("groupForm").onsubmit=saveGroup;el("memberForm").onsubmit=addMember;el("searchBox").oninput=render;el("statusFilter").onchange=render;loadAll()});
async function loadAll(){const box=el("pageStatus"),[g,gm,m]=await Promise.all([supabaseClient.from("church_groups").select("*").order("created_at",{ascending:false}),supabaseClient.from("church_group_members").select("*,member:members(id,member_number,full_name,phone,email)"),supabaseClient.from("members").select("id,member_number,full_name,phone").eq("membership_status","Active").order("full_name")]);if(g.error||gm.error||m.error){box.textContent=(g.error||gm.error||m.error).message;box.className="mb-4 text-sm font-bold text-red-600";return}groups=g.data||[];memberships=gm.data||[];members=m.data||[];box.textContent="";stats();render()}
function stats(){el("totalGroups").textContent=groups.length;el("activeGroups").textContent=groups.filter(x=>x.status==="Active").length;el("totalMemberships").textContent=memberships.filter(x=>x.status==="Active").length}
function render(){const q=el("searchBox").value.toLowerCase(),st=el("statusFilter").value,items=groups.filter(x=>(st==="all"||x.status===st)&&[x.group_number,x.group_name,x.group_type,x.leader_name,x.location,x.branch].join(" ").toLowerCase().includes(q));el("groupList").innerHTML=items.length?items.map(x=>{const count=memberships.filter(m=>m.group_id===x.id&&m.status==="Active").length,full=x.maximum_members&&count>=x.maximum_members;return `<article class="group-card"><div class="flex justify-between gap-3"><div><div class="flex gap-2"><span class="badge ${x.status==="Active"?"bg-green-100 text-green-700":"bg-slate-200 text-slate-600"}">${esc(x.status)}</span><span class="text-[9px] font-black text-slate-400">${esc(x.group_number)}</span></div><h3 class="text-lg font-black mt-3">${esc(x.group_name)}</h3><p class="text-xs text-violet-600 font-bold">${esc(x.group_type)}</p></div><div class="text-right"><p class="text-2xl font-black ${full?"text-red-600":"text-violet-600"}">${count}${x.maximum_members?`/${x.maximum_members}`:""}</p><p class="sub">members</p></div></div><div class="mt-4 grid grid-cols-2 gap-3 text-xs"><p><span class="text-slate-400">Leader:</span><br><b>${esc(x.leader_name)}</b></p><p><span class="text-slate-400">Schedule:</span><br><b>${esc(x.meeting_day)} ${esc(String(x.meeting_time||"").slice(0,5))}</b></p><p><span class="text-slate-400">Location:</span><br><b>${esc(x.location)}</b></p><p><span class="text-slate-400">Branch:</span><br><b>${esc(x.branch)}</b></p></div><div class="mt-4 flex flex-wrap gap-2"><button onclick="openRoster('${x.id}')" class="btn bg-violet-50 text-violet-700">Roster</button><button onclick="editGroup('${x.id}')" class="btn bg-blue-50 text-blue-700">Edit</button><button onclick="setGroupStatus('${x.id}','${x.status==="Active"?"Paused":"Active"}')" class="btn bg-amber-50 text-amber-700">${x.status==="Active"?"Pause":"Activate"}</button><button onclick="deleteGroup('${x.id}')" class="btn bg-red-50 text-red-700">Delete</button></div></article>`}).join(""):'<div class="panel lg:col-span-2 text-center text-slate-400 font-bold">No groups found.</div>'}
async function saveGroup(e){e.preventDefault();const payload={group_name:el("groupName").value.trim(),group_type:el("groupType").value,leader_name:el("leaderName").value.trim(),assistant_leader:clean(el("assistantLeader").value),meeting_day:el("meetingDay").value,meeting_time:el("meetingTime").value||null,meeting_frequency:el("meetingFrequency").value,location:el("location").value.trim(),branch:el("branch").value,maximum_members:el("maximumMembers").value?Number(el("maximumMembers").value):null,description:clean(el("description").value),notes:clean(el("notes").value)},id=el("editingId").value;const result=id?await supabaseClient.from("church_groups").update(payload).eq("id",id):await supabaseClient.from("church_groups").insert(payload);if(result.error)return show(result.error.message,false);show(id?"Group updated.":"Group created.",true);resetForm();await loadAll()}
function editGroup(id){const x=groups.find(g=>g.id===id);if(!x)return;el("editingId").value=x.id;el("groupName").value=x.group_name;el("groupType").value=x.group_type;el("leaderName").value=x.leader_name;el("assistantLeader").value=x.assistant_leader||"";el("meetingDay").value=x.meeting_day;el("meetingTime").value=x.meeting_time||"";el("meetingFrequency").value=x.meeting_frequency;el("location").value=x.location;el("branch").value=x.branch;el("maximumMembers").value=x.maximum_members||"";el("description").value=x.description||"";el("notes").value=x.notes||"";el("saveBtn").innerHTML='<i class="fas fa-floppy-disk mr-2"></i>Update Group';scrollTo({top:0,behavior:"smooth"})}
async function setGroupStatus(id,status){const {error}=await supabaseClient.from("church_groups").update({status}).eq("id",id);if(error)return alert(error.message);await loadAll()}async function deleteGroup(id){if(!confirm("Delete this group and its roster permanently?"))return;const {error}=await supabaseClient.from("church_groups").delete().eq("id",id);if(error)return alert(error.message);await loadAll()}
function openRoster(id){selectedGroup=groups.find(x=>x.id===id);if(!selectedGroup)return;el("rosterTitle").textContent=selectedGroup.group_name;el("rosterMeta").textContent=`${selectedGroup.group_number} · Leader: ${selectedGroup.leader_name}`;buildMemberOptions();renderRoster();el("rosterModal").classList.remove("hidden");el("rosterModal").classList.add("flex")}function closeRoster(){el("rosterModal").classList.add("hidden");el("rosterModal").classList.remove("flex");selectedGroup=null}
function buildMemberOptions(){const assigned=new Set(memberships.filter(x=>x.group_id===selectedGroup.id).map(x=>x.member_id));el("memberId").innerHTML='<option value="">Select active member</option>'+members.filter(x=>!assigned.has(x.id)).map(x=>`<option value="${x.id}">${esc(x.full_name)} · ${esc(x.member_number||"")}</option>`).join("")}
function renderRoster(){const rows=memberships.filter(x=>x.group_id===selectedGroup.id);el("rosterList").innerHTML=rows.length?rows.map(x=>`<div class="border rounded-2xl p-4 flex justify-between items-center gap-3"><div><b>${esc(x.member?.full_name||"Member")}</b><p class="sub">${esc(x.member?.member_number||"")} · ${esc(x.role)} · Joined ${esc(x.joined_date)}</p></div><button onclick="removeMember('${x.id}')" class="btn bg-red-50 text-red-700">Remove</button></div>`).join(""):'<p class="text-center text-slate-400 font-bold py-8">No members assigned.</p>'}
async function addMember(e){e.preventDefault();if(!selectedGroup)return;const active=memberships.filter(x=>x.group_id===selectedGroup.id&&x.status==="Active").length;if(selectedGroup.maximum_members&&active>=selectedGroup.maximum_members)return el("rosterStatus").textContent="This group has reached its maximum capacity.";const {error}=await supabaseClient.from("church_group_members").insert({group_id:selectedGroup.id,member_id:el("memberId").value,role:el("memberRole").value});if(error){el("rosterStatus").textContent=error.message;return}el("rosterStatus").textContent="Member added.";await loadAll();selectedGroup=groups.find(x=>x.id===selectedGroup.id);buildMemberOptions();renderRoster()}
async function removeMember(id){if(!confirm("Remove this member from the group?"))return;const {error}=await supabaseClient.from("church_group_members").delete().eq("id",id);if(error)return alert(error.message);await loadAll();selectedGroup=groups.find(x=>x.id===selectedGroup.id);buildMemberOptions();renderRoster()}
function resetForm(){el("groupForm").reset();el("editingId").value="";el("branch").value="Okahandja HQ";el("saveBtn").innerHTML='<i class="fas fa-people-roof mr-2"></i>Save Group'}function exportGroups(){const data=[["Group Number","Name","Type","Leader","Day","Time","Location","Branch","Status","Members"],...groups.map(x=>[x.group_number,x.group_name,x.group_type,x.leader_name,x.meeting_day,x.meeting_time,x.location,x.branch,x.status,memberships.filter(m=>m.group_id===x.id&&m.status==="Active").length])],csv=data.map(r=>r.map(v=>'"'+String(v??"").replaceAll('"','""')+'"').join(",")).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="sky-grace-small-groups.csv";a.click();URL.revokeObjectURL(a.href)}function show(m,ok){el("formStatus").textContent=m;el("formStatus").className=`rounded-xl p-3 text-sm font-bold ${ok?"bg-green-50 text-green-700":"bg-red-50 text-red-700"}`}function clean(v){v=String(v||"").trim();return v||null}function esc(v){return String(v||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
</script></body></html>
