<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Admin Login | Sky Grace Jesus Ministry</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
</head>

<body class="min-h-screen bg-slate-950 text-white flex items-center justify-center px-6">

  <main class="w-full max-w-md">
    <div class="rounded-[2rem] bg-white text-slate-900 p-8 shadow-2xl border border-white/10">
      <div class="text-center">
        <div class="mx-auto w-16 h-16 rounded-2xl bg-blue-600 text-white flex items-center justify-center text-2xl">
          <i class="fa-solid fa-lock"></i>
        </div>

        <h1 class="mt-6 text-2xl font-black uppercase tracking-tight">
          Admin Login
        </h1>

        <p class="mt-2 text-sm text-slate-500">
          Sky Grace Jesus Ministry control panel
        </p>
      </div>

      <form id="adminLoginForm" class="mt-8 space-y-4">
        <div>
          <label class="text-xs font-black uppercase tracking-widest text-slate-500">
            Email Address
          </label>
          <input
            id="adminEmail"
            type="email"
            required
            placeholder="admin@example.com"
            class="mt-2 w-full rounded-2xl border border-slate-200 px-5 py-4 outline-none focus:border-blue-500"
          />
        </div>

        <div>
          <label class="text-xs font-black uppercase tracking-widest text-slate-500">
            Password
          </label>
          <input
            id="adminPassword"
            type="password"
            required
            placeholder="Enter password"
            class="mt-2 w-full rounded-2xl border border-slate-200 px-5 py-4 outline-none focus:border-blue-500"
          />
        </div>

        <button
          type="submit"
          class="w-full rounded-2xl bg-blue-600 px-6 py-4 text-white font-black uppercase text-xs tracking-widest hover:bg-blue-500 transition"
        >
          <i class="fa-solid fa-right-to-bracket mr-2"></i>
          Login
        </button>

        <p id="loginStatus"></p>
      </form>

      <div class="mt-6 text-center">
        <a href="index.html" class="text-xs font-black uppercase tracking-widest text-blue-600 hover:underline">
          ← Back to Website
        </a>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
