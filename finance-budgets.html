<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finance Budgets | Sky Grace Admin</title><script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"></head><body class="bg-slate-50 flex min-h-screen"><div id="admin-sidebar-mount"></div><script src="admin-sidebar.js" defer></script><div class="flex-1 min-w-0"><header class="h-16 bg-white border-b px-8 flex items-center justify-between sticky top-0 z-30"><h1 class="font-black">Ministry Budgets</h1><div class="flex gap-3"><a href="finance-manager.html" class="btn bg-slate-100 text-slate-700"><i class="fas fa-arrow-left mr-2"></i>Finance</a><a href="finance-reports.html" class="btn bg-blue-600 text-white"><i class="fas fa-chart-column mr-2"></i>Reports</a></div></header>
<main class="p-6 lg:p-8 max-w-[1500px] mx-auto"><section class="grid xl:grid-cols-[390px_1fr] gap-7 items-start"><form id="budgetForm" class="panel space-y-5 xl:sticky xl:top-24"><input id="editingId" type="hidden"><div><h2 class="text-xl font-black">Create Budget</h2><p class="sub">Allocate funds to a ministry department and expense category.</p></div><div><label class="label">Financial Year *</label><input id="fiscalYear" type="number" min="2020" max="2100" required class="field"></div><div><label class="label">Department *</label><select id="department" class="field"><option>General Ministry</option><option>Administration</option><option>Media</option><option>Outreach</option><option>Children's Ministry</option><option>Youth Ministry</option><option>Worship</option><option>Theology School</option><option>Facilities</option><option>Transport</option></select></div><div><label class="label">Expense Category *</label><select id="expenseCategory" class="field"><option>Utilities</option><option>Rent</option><option>Maintenance</option><option>Transport</option><option>Ministry Program</option><option>Salaries</option><option>Equipment</option><option>Outreach</option><option>Other Expense</option></select></div><div><label class="label">Allocated Amount (N$) *</label><input id="allocatedAmount" type="number" min="0.01" step="0.01" required class="field" placeholder="0.00"></div><div><label class="label">Notes</label><textarea id="notes" rows="3" class="field"></textarea></div><p id="formStatus" class="hidden rounded-xl p-3 text-sm font-bold"></p><div class="flex gap-3"><button id="saveBtn" class="btn bg-violet-600 text-white flex-1"><i class="fas fa-floppy-disk mr-2"></i>Save Budget</button><button type="button" onclick="resetForm()" class="btn bg-slate-100 text-slate-600">Clear</button></div></form>
<div><section class="grid sm:grid-cols-3 gap-4 mb-5"><div class="stat"><small>Total Budget</small><strong id="totalBudget" class="text-violet-600">N$ 0.00</strong></div><div class="stat"><small>Approved Spending</small><strong id="totalSpent" class="text-red-600">N$ 0.00</strong></div><div class="stat"><small>Remaining</small><strong id="totalRemaining" class="text-green-600">N$ 0.00</strong></div></section><div class="flex gap-3 mb-4"><select id="yearFilter" class="field max-w-52"></select><input id="search" class="field" placeholder="Search department or category..."></div><p id="pageStatus" class="mb-4 text-sm font-bold text-slate-500">Loading budgets...</p><div id="budgetList" class="space-y-4"></div></div></section></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase.js"></script><script src="assets/js/guard.js"></script><style>.panel,.stat,.budget-card{background:white;border:1px solid #e2e8f0;border-radius:1rem;padding:1.3rem}.label,.stat small{display:block;margin-bottom:.4rem;font-size:.62rem;font-weight:900;text-transform:uppercase;letter-spacing:.1em;color:#94a3b8}.field{width:100%;background:#f8fafc;border:1px solid #e2e8f0;border-radius:.75rem;padding:.8rem 1rem;font-size:.8rem;font-weight:700}.btn{border-radius:.75rem;padding:.8rem 1rem;font-size:.68rem;font-weight:900;text-transform:uppercase;letter-spacing:.06em}.sub{font-size:.78rem;color:#64748b;margin-top:.25rem}.stat strong{display:block;font-size:1.5rem;margin-top:.45rem}.progress{height:.65rem;background:#e2e8f0;border-radius:99px;overflow:hidden}.progress>span{display:block;height:100%;border-radius:99px}</style>
<script>
let budgets=[],expenses=[];const byId=id=>document.getElementById(id);document.addEventListener("DOMContentLoaded",async()=>{fiscalYear.value=new Date().getFullYear();budgetForm.onsubmit=saveBudget;search.oninput=render;yearFilter.onchange=render;await load()});
async function load(){const [b,t]=await Promise.all([supabaseClient.from("finance_budgets").select("*").order("department"),supabaseClient.from("finance_transactions").select("transaction_date,category,amount").eq("transaction_type","Expense").eq("status","Approved")]);if(b.error||t.error){pageStatus.textContent=(b.error||t.error).message;pageStatus.className="mb-4 text-sm font-bold text-red-600";return}budgets=b.data||[];expenses=t.data||[];buildYears();pageStatus.textContent="";render()}
function buildYears(){const years=[...new Set([new Date().getFullYear(),...budgets.map(x=>x.fiscal_year)])].sort((a,b)=>b-a);const old=yearFilter.value;yearFilter.innerHTML=years.map(y=>`<option>${y}</option>`).join("");if(old&&years.includes(Number(old)))yearFilter.value=old}
function spentFor(b){return expenses.filter(x=>Number(x.transaction_date.slice(0,4))===b.fiscal_year&&x.category===b.expense_category).reduce((n,x)=>n+Number(x.amount),0)}
function render(){const year=Number(yearFilter.value||new Date().getFullYear()),q=search.value.toLowerCase(),items=budgets.filter(x=>x.fiscal_year===year&&[x.department,x.expense_category,x.notes].join(" ").toLowerCase().includes(q));const budget=items.reduce((n,x)=>n+Number(x.allocated_amount),0),spent=items.reduce((n,x)=>n+spentFor(x),0);totalBudget.textContent=money(budget);totalSpent.textContent=money(spent);totalRemaining.textContent=money(budget-spent);budgetList.innerHTML=items.length?items.map(x=>{const s=spentFor(x),a=Number(x.allocated_amount),pct=a?Math.round(s/a*100):0,over=pct>100;return `<article class="budget-card"><div class="flex justify-between gap-4"><div><p class="text-[10px] font-black uppercase tracking-widest text-violet-600">${esc(x.department)}</p><h3 class="font-black text-lg mt-1">${esc(x.expense_category)}</h3><p class="text-xs text-slate-400 mt-1">${esc(x.notes||"No notes")}</p></div><div class="text-right"><p class="text-xs text-slate-400">Allocated</p><p class="font-black">${money(a)}</p></div></div><div class="mt-5 progress"><span class="${over?"bg-red-500":"bg-violet-600"}" style="width:${Math.min(pct,100)}%"></span></div><div class="mt-2 flex justify-between text-xs font-bold"><span class="${over?"text-red-600":"text-slate-500"}">${pct}% used · ${money(s)} spent</span><span>${money(a-s)} remaining</span></div><div class="mt-4 flex gap-2"><button onclick="editBudget('${x.id}')" class="btn bg-blue-50 text-blue-700">Edit</button><button onclick="deleteBudget('${x.id}')" class="btn bg-red-50 text-red-700">Delete</button></div></article>`}).join(""):'<div class="panel text-center text-slate-400 font-bold">No budgets found for this year.</div>'}
async function saveBudget(e){e.preventDefault();const payload={fiscal_year:Number(fiscalYear.value),department:department.value,expense_category:expenseCategory.value,allocated_amount:Number(allocatedAmount.value),notes:clean(notes.value)},id=editingId.value;saveBtn.disabled=true;const result=id?await supabaseClient.from("finance_budgets").update(payload).eq("id",id):await supabaseClient.from("finance_budgets").insert(payload);saveBtn.disabled=false;if(result.error)return show(result.error.message,false);show(id?"Budget updated.":"Budget created.",true);resetForm();await load()}
function editBudget(id){const x=budgets.find(b=>b.id===id);if(!x)return;editingId.value=x.id;fiscalYear.value=x.fiscal_year;department.value=x.department;expenseCategory.value=x.expense_category;allocatedAmount.value=x.allocated_amount;notes.value=x.notes||"";saveBtn.innerHTML='<i class="fas fa-floppy-disk mr-2"></i>Update Budget';scrollTo({top:0,behavior:"smooth"})}
async function deleteBudget(id){if(!confirm("Delete this budget allocation?"))return;const {error}=await supabaseClient.from("finance_budgets").delete().eq("id",id);if(error)return alert(error.message);await load()}
function resetForm(){budgetForm.reset();editingId.value="";fiscalYear.value=new Date().getFullYear();saveBtn.innerHTML='<i class="fas fa-floppy-disk mr-2"></i>Save Budget'}function show(m,ok){formStatus.textContent=m;formStatus.className=`rounded-xl p-3 text-sm font-bold ${ok?"bg-green-50 text-green-700":"bg-red-50 text-red-700"}`}function money(v){return new Intl.NumberFormat("en-NA",{style:"currency",currency:"NAD"}).format(Number(v||0))}function clean(v){v=String(v||"").trim();return v||null}function esc(v){return String(v||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
</script></body></html>
