<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Children's Ministry | Sky Grace Admin</title><script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"></head><body class="bg-slate-50 flex min-h-screen"><div id="admin-sidebar-mount"></div><script src="admin-sidebar.js" defer></script><div class="flex-1 min-w-0"><header class="h-16 bg-white border-b px-8 flex items-center justify-between sticky top-0 z-30"><div><h1 class="font-black">Children's Ministry</h1><p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Register, protect and care for every child</p></div><button onclick="exportChildren()" class="btn bg-green-600 text-white"><i class="fas fa-file-csv mr-2"></i>Export CSV</button></header>
<main class="p-6 lg:p-8 max-w-[1600px] mx-auto"><section class="grid xl:grid-cols-[400px_1fr] gap-7 items-start"><form id="childForm" class="panel space-y-5 xl:sticky xl:top-24"><input id="editingId" type="hidden"><div><h2 class="text-xl font-black">Register Child</h2><p class="sub">Record the child's care and guardian information.</p></div><div><label class="label">Full Name *</label><input id="fullName" required class="field" placeholder="Child's full name"></div><div class="grid grid-cols-2 gap-4"><div><label class="label">Date of Birth *</label><input id="dateOfBirth" required type="date" class="field"></div><div><label class="label">Gender</label><select id="gender" class="field"><option value="">Not specified</option><option>Male</option><option>Female</option></select></div></div><div class="grid grid-cols-2 gap-4"><div><label class="label">Class *</label><select id="className" class="field"><option>To Be Assigned</option><option>Nursery (0-2)</option><option>Toddlers (3-5)</option><option>Primary (6-9)</option><option>Pre-Teens (10-12)</option><option>Teens (13+)</option></select></div><div><label class="label">Branch *</label><select id="branch" class="field"><option>Okahandja HQ</option><option>Windhoek</option><option>Online</option><option>Other</option></select></div></div><div><label class="label">Guardian Name *</label><input id="guardianName" required class="field"></div><div class="grid grid-cols-2 gap-4"><div><label class="label">Relationship</label><input id="relationship" class="field" placeholder="Mother, father..."></div><div><label class="label">Phone *</label><input id="guardianPhone" required class="field" placeholder="+264..."></div></div><div class="grid grid-cols-2 gap-4"><div><label class="label">Alternate Phone</label><input id="alternatePhone" class="field"></div><div><label class="label">Email</label><input id="guardianEmail" type="email" class="field"></div></div><div><label class="label">Authorised Pickup People</label><textarea id="authorisedPickup" rows="2" class="field" placeholder="Names and relationships"></textarea></div><div><label class="label">Allergies</label><textarea id="allergies" rows="2" class="field"></textarea></div><div><label class="label">Medical / Special Care Notes</label><textarea id="medicalNotes" rows="2" class="field"></textarea></div><label class="flex gap-3 items-center text-xs font-bold"><input id="photoConsent" type="checkbox" class="w-4 h-4">Guardian gave photo/video consent</label><div><label class="label">Notes</label><textarea id="notes" rows="2" class="field"></textarea></div><p id="formStatus" class="hidden rounded-xl p-3 text-sm font-bold"></p><div class="flex gap-3"><button id="saveBtn" class="btn bg-pink-600 text-white flex-1"><i class="fas fa-child-reaching mr-2"></i>Save Child</button><button type="button" onclick="resetForm()" class="btn bg-slate-100 text-slate-600">Clear</button></div></form>
<div><section class="grid sm:grid-cols-4 gap-4 mb-5"><div class="stat"><small>Registered</small><strong id="totalChildren">0</strong></div><div class="stat"><small>Active</small><strong id="activeChildren" class="text-green-600">0</strong></div><div class="stat"><small>Checked In Today</small><strong id="checkedInToday" class="text-blue-600">0</strong></div><div class="stat"><small>Awaiting Pickup</small><strong id="awaitingPickup" class="text-orange-500">0</strong></div></section><div class="grid md:grid-cols-[1fr_200px_170px] gap-3 mb-4"><input id="searchBox" class="field" placeholder="Search child, guardian, phone..."><select id="classFilter" class="field"><option value="all">All classes</option><option>To Be Assigned</option><option>Nursery (0-2)</option><option>Toddlers (3-5)</option><option>Primary (6-9)</option><option>Pre-Teens (10-12)</option><option>Teens (13+)</option></select><select id="statusFilter" class="field"><option value="all">All statuses</option><option>Active</option><option>Inactive</option><option>Graduated</option></select></div><p id="pageStatus" class="mb-4 text-sm font-bold text-slate-500">Loading children...</p><div id="childList" class="grid lg:grid-cols-2 gap-4"></div></div></section></main></div>
<div id="checkoutModal" class="fixed inset-0 bg-slate-950/60 hidden items-center justify-center z-50 p-5"><form id="checkoutForm" class="bg-white rounded-3xl w-full max-w-lg p-7"><h2 class="text-2xl font-black">Safe Child Pickup</h2><p id="checkoutChild" class="sub mt-1"></p><input id="checkoutAttendanceId" type="hidden"><div class="mt-5"><label class="label">Released To *</label><input id="releasedTo" required class="field" placeholder="Full name of person collecting child"></div><div class="mt-4"><label class="label">Pickup Notes</label><textarea id="checkoutNotes" rows="2" class="field"></textarea></div><div class="flex gap-3 mt-6"><button class="btn bg-green-600 text-white flex-1">Confirm Check-out</button><button type="button" onclick="closeCheckout()" class="btn bg-slate-100">Cancel</button></div></form></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase.js"></script><script src="assets/js/guard.js"></script><style>.panel,.stat,.child-card{background:#fff;border:1px solid #e2e8f0;border-radius:1rem;padding:1.25rem}.label,.stat small{display:block;margin-bottom:.4rem;font-size:.61rem;font-weight:900;text-transform:uppercase;letter-spacing:.1em;color:#94a3b8}.field{width:100%;background:#f8fafc;border:1px solid #e2e8f0;border-radius:.75rem;padding:.78rem .95rem;font-size:.78rem;font-weight:700}.btn{border-radius:.75rem;padding:.78rem 1rem;font-size:.67rem;font-weight:900;text-transform:uppercase;letter-spacing:.06em}.sub{font-size:.75rem;color:#64748b}.stat strong{display:block;font-size:1.5rem;margin-top:.4rem}.badge{padding:.35rem .65rem;border-radius:99px;font-size:.56rem;font-weight:900;text-transform:uppercase}</style>
<script>
let children=[],attendance=[];const el=id=>document.getElementById(id);document.addEventListener("DOMContentLoaded",()=>{el("childForm").onsubmit=saveChild;el("checkoutForm").onsubmit=confirmCheckout;el("searchBox").oninput=render;el("classFilter").onchange=render;el("statusFilter").onchange=render;loadAll()});
async function loadAll(){const box=el("pageStatus"),[c,a]=await Promise.all([supabaseClient.from("church_children").select("*").order("created_at",{ascending:false}),supabaseClient.from("children_attendance").select("*").order("attendance_date",{ascending:false})]);if(c.error||a.error){box.textContent=(c.error||a.error).message;box.className="mb-4 text-sm font-bold text-red-600";return}children=c.data||[];attendance=a.data||[];box.textContent="";stats();render()}
function today(){return new Date().toISOString().slice(0,10)}function age(d){const b=new Date(d),n=new Date();let a=n.getFullYear()-b.getFullYear();if(n.getMonth()<b.getMonth()||(n.getMonth()===b.getMonth()&&n.getDate()<b.getDate()))a--;return a}
function stats(){const t=attendance.filter(x=>x.attendance_date===today());el("totalChildren").textContent=children.length;el("activeChildren").textContent=children.filter(x=>x.status==="Active").length;el("checkedInToday").textContent=t.length;el("awaitingPickup").textContent=t.filter(x=>!x.check_out_time).length}
function render(){const q=el("searchBox").value.toLowerCase(),cl=el("classFilter").value,st=el("statusFilter").value,items=children.filter(x=>(cl==="all"||x.class_name===cl)&&(st==="all"||x.status===st)&&[x.child_number,x.full_name,x.guardian_name,x.guardian_phone,x.class_name].join(" ").toLowerCase().includes(q));el("childList").innerHTML=items.length?items.map(x=>{const att=attendance.find(a=>a.child_id===x.id&&a.attendance_date===today()),waiting=att&&!att.check_out_time;return `<article class="child-card"><div class="flex justify-between gap-3"><div><div class="flex gap-2"><span class="badge ${x.status==="Active"?"bg-green-100 text-green-700":"bg-slate-200 text-slate-600"}">${esc(x.status)}</span><span class="text-[9px] font-black text-slate-400">${esc(x.child_number)}</span></div><h3 class="text-lg font-black mt-3">${esc(x.full_name)}</h3><p class="text-xs text-pink-600 font-bold">${age(x.date_of_birth)} years · ${esc(x.class_name)}</p></div>${waiting?'<span class="badge bg-orange-100 text-orange-700 h-fit">Awaiting Pickup</span>':att?'<span class="badge bg-green-100 text-green-700 h-fit">Checked Out</span>':''}</div><div class="mt-4 grid grid-cols-2 gap-3 text-xs"><p><span class="text-slate-400">Guardian:</span><br><b>${esc(x.guardian_name)}</b></p><p><span class="text-slate-400">Phone:</span><br><b>${esc(x.guardian_phone)}</b></p><p><span class="text-slate-400">Branch:</span><br><b>${esc(x.branch)}</b></p><p><span class="text-slate-400">Photo consent:</span><br><b>${x.photo_consent?"Yes":"No"}</b></p></div>${x.allergies?`<p class="mt-3 bg-red-50 text-red-700 rounded-xl p-3 text-xs"><b>Allergies:</b> ${esc(x.allergies)}</p>`:""}<div class="mt-4 flex flex-wrap gap-2">${!att?`<button onclick="checkIn('${x.id}')" class="btn bg-blue-50 text-blue-700">Check In</button>`:waiting?`<button onclick="openCheckout('${x.id}','${att.id}')" class="btn bg-green-50 text-green-700">Check Out</button>`:""}<button onclick="editChild('${x.id}')" class="btn bg-pink-50 text-pink-700">Edit</button><button onclick="setStatus('${x.id}','${x.status==="Active"?"Inactive":"Active"}')" class="btn bg-amber-50 text-amber-700">${x.status==="Active"?"Deactivate":"Activate"}</button><button onclick="deleteChild('${x.id}')" class="btn bg-red-50 text-red-700">Delete</button></div></article>`}).join(""):'<div class="panel lg:col-span-2 text-center text-slate-400 font-bold">No children found.</div>'}
async function saveChild(e){e.preventDefault();const payload={full_name:el("fullName").value.trim(),date_of_birth:el("dateOfBirth").value,gender:clean(el("gender").value),class_name:el("className").value,branch:el("branch").value,guardian_name:el("guardianName").value.trim(),guardian_relationship:clean(el("relationship").value),guardian_phone:el("guardianPhone").value.trim(),alternate_phone:clean(el("alternatePhone").value),guardian_email:clean(el("guardianEmail").value),authorised_pickup:clean(el("authorisedPickup").value),allergies:clean(el("allergies").value),medical_notes:clean(el("medicalNotes").value),photo_consent:el("photoConsent").checked,notes:clean(el("notes").value)},id=el("editingId").value,r=id?await supabaseClient.from("church_children").update(payload).eq("id",id):await supabaseClient.from("church_children").insert(payload);if(r.error)return show(r.error.message,false);show(id?"Child updated.":"Child registered.",true);resetForm();await loadAll()}
function editChild(id){const x=children.find(v=>v.id===id);if(!x)return;el("editingId").value=x.id;el("fullName").value=x.full_name;el("dateOfBirth").value=x.date_of_birth;el("gender").value=x.gender||"";el("className").value=x.class_name;el("branch").value=x.branch;el("guardianName").value=x.guardian_name;el("relationship").value=x.guardian_relationship||"";el("guardianPhone").value=x.guardian_phone;el("alternatePhone").value=x.alternate_phone||"";el("guardianEmail").value=x.guardian_email||"";el("authorisedPickup").value=x.authorised_pickup||"";el("allergies").value=x.allergies||"";el("medicalNotes").value=x.medical_notes||"";el("photoConsent").checked=x.photo_consent;el("notes").value=x.notes||"";el("saveBtn").innerHTML='<i class="fas fa-floppy-disk mr-2"></i>Update Child';scrollTo({top:0,behavior:"smooth"})}
async function checkIn(id){const child=children.find(x=>x.id===id);if(!child||!confirm(`Check in ${child.full_name} now?`))return;const {error}=await supabaseClient.from("children_attendance").insert({child_id:id,attendance_date:today(),class_name:child.class_name});if(error)return alert(error.message);await loadAll()}function openCheckout(childId,attendanceId){const x=children.find(v=>v.id===childId);el("checkoutAttendanceId").value=attendanceId;el("checkoutChild").textContent=`Child: ${x.full_name}. Authorised pickup: ${x.authorised_pickup||"Not recorded — verify with guardian."}`;el("releasedTo").value="";el("checkoutNotes").value="";el("checkoutModal").classList.remove("hidden");el("checkoutModal").classList.add("flex")}function closeCheckout(){el("checkoutModal").classList.add("hidden");el("checkoutModal").classList.remove("flex")}
async function confirmCheckout(e){e.preventDefault();const {error}=await supabaseClient.from("children_attendance").update({check_out_time:new Date().toISOString(),released_to:el("releasedTo").value.trim(),notes:clean(el("checkoutNotes").value)}).eq("id",el("checkoutAttendanceId").value);if(error)return alert(error.message);closeCheckout();await loadAll()}async function setStatus(id,status){const {error}=await supabaseClient.from("church_children").update({status}).eq("id",id);if(error)return alert(error.message);await loadAll()}async function deleteChild(id){if(!confirm("Permanently delete this child and attendance history?"))return;const {error}=await supabaseClient.from("church_children").delete().eq("id",id);if(error)return alert(error.message);await loadAll()}
function resetForm(){el("childForm").reset();el("editingId").value="";el("className").value="To Be Assigned";el("branch").value="Okahandja HQ";el("saveBtn").innerHTML='<i class="fas fa-child-reaching mr-2"></i>Save Child'}function exportChildren(){const rows=[["Child Number","Full Name","Date of Birth","Age","Class","Branch","Guardian","Relationship","Phone","Alternate Phone","Email","Allergies","Photo Consent","Status"],...children.map(x=>[x.child_number,x.full_name,x.date_of_birth,age(x.date_of_birth),x.class_name,x.branch,x.guardian_name,x.guardian_relationship,x.guardian_phone,x.alternate_phone,x.guardian_email,x.allergies,x.photo_consent?"Yes":"No",x.status])],csv=rows.map(r=>r.map(v=>'"'+String(v??"").replaceAll('"','""')+'"').join(",")).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="sky-grace-children-ministry.csv";a.click();URL.revokeObjectURL(a.href)}function show(m,ok){el("formStatus").textContent=m;el("formStatus").className=`rounded-xl p-3 text-sm font-bold ${ok?"bg-green-50 text-green-700":"bg-red-50 text-red-700"}`}function clean(v){v=String(v||"").trim();return v||null}function esc(v){return String(v||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
</script></body></html>
