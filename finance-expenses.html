<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expense Approval | Sky Grace Admin</title><script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"></head><body class="bg-slate-50 flex min-h-screen"><div id="admin-sidebar-mount"></div><script src="admin-sidebar.js" defer></script><div class="flex-1 min-w-0"><header class="h-16 bg-white border-b px-8 flex items-center justify-between sticky top-0 z-30"><h1 class="font-black">Expense Documents & Approval</h1><div class="flex gap-3"><a href="finance-manager.html" class="btn bg-slate-100 text-slate-700"><i class="fas fa-arrow-left mr-2"></i>Finance</a><a href="finance-budgets.html" class="btn bg-violet-600 text-white"><i class="fas fa-wallet mr-2"></i>Budgets</a></div></header>
<main class="p-6 lg:p-8 max-w-[1500px] mx-auto"><section class="grid xl:grid-cols-[410px_1fr] gap-7 items-start"><form id="expenseForm" class="panel space-y-5 xl:sticky xl:top-24"><div><h2 class="text-xl font-black">Submit Expense</h2><p class="sub">Attach a PDF or image invoice/receipt. Maximum file size: 10 MB.</p></div><div><label class="label">Expense Date *</label><input id="expenseDate" type="date" required class="field"></div><div><label class="label">Category *</label><select id="category" class="field"><option>Utilities</option><option>Rent</option><option>Maintenance</option><option>Transport</option><option>Ministry Program</option><option>Salaries</option><option>Equipment</option><option>Outreach</option><option>Other Expense</option></select></div><div><label class="label">Payee *</label><input id="payee" required class="field" placeholder="Business or person paid"></div><div><label class="label">Amount (N$) *</label><input id="amount" type="number" min="0.01" step="0.01" required class="field" placeholder="0.00"></div><div class="grid grid-cols-2 gap-4"><div><label class="label">Payment Method *</label><select id="paymentMethod" class="field"><option>Cash</option><option>Bank Transfer</option><option>Card</option><option>Mobile Payment</option><option>Other</option></select></div><div><label class="label">Reference</label><input id="reference" class="field"></div></div><div><label class="label">Purpose *</label><textarea id="description" rows="3" required class="field"></textarea></div><div><label class="label">Invoice / Receipt *</label><input id="documentFile" type="file" required accept="application/pdf,image/jpeg,image/png,image/webp" class="field"></div><div id="uploadProgress" class="hidden"><div class="progress"><span id="progressBar" style="width:0%"></span></div><p id="progressText" class="sub mt-2">Preparing upload...</p></div><p id="formStatus" class="hidden rounded-xl p-3 text-sm font-bold"></p><button id="saveBtn" class="btn bg-blue-600 text-white w-full py-4"><i class="fas fa-cloud-arrow-up mr-2"></i>Submit Expense</button></form>
<div><section class="grid sm:grid-cols-3 gap-4 mb-5"><div class="stat"><small>Pending</small><strong id="pendingCount" class="text-amber-500">0</strong></div><div class="stat"><small>Approved</small><strong id="approvedTotal" class="text-green-600">N$ 0.00</strong></div><div class="stat"><small>Voided</small><strong id="voidedCount" class="text-slate-500">0</strong></div></section><div class="flex gap-3 mb-4"><input id="searchBox" class="field" placeholder="Search payee, receipt, category..."><select id="statusFilter" class="field max-w-48"><option value="all">All statuses</option><option>Pending</option><option>Approved</option><option>Voided</option></select></div><p id="pageStatus" class="mb-4 text-sm font-bold text-slate-500">Loading expenses...</p><div id="expenseList" class="space-y-4"></div></div></section></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase.js"></script><script src="assets/js/guard.js"></script><style>.panel,.stat,.expense-card{background:white;border:1px solid #e2e8f0;border-radius:1rem;padding:1.3rem}.label,.stat small{display:block;margin-bottom:.4rem;font-size:.62rem;font-weight:900;text-transform:uppercase;letter-spacing:.1em;color:#94a3b8}.field{width:100%;background:#f8fafc;border:1px solid #e2e8f0;border-radius:.75rem;padding:.8rem 1rem;font-size:.8rem;font-weight:700}.btn{border-radius:.75rem;padding:.8rem 1rem;font-size:.68rem;font-weight:900;text-transform:uppercase;letter-spacing:.06em}.sub{font-size:.76rem;color:#64748b}.stat strong{display:block;font-size:1.55rem;margin-top:.45rem}.progress{height:.6rem;background:#e2e8f0;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:#2563eb;transition:width .25s}</style>
<script>
let expenses=[];const el=id=>document.getElementById(id);document.addEventListener("DOMContentLoaded",async()=>{el("expenseDate").value=new Date().toISOString().slice(0,10);el("expenseForm").onsubmit=submitExpense;el("searchBox").oninput=render;el("statusFilter").onchange=render;await loadExpenses()});
async function submitExpense(e){e.preventDefault();const file=el("documentFile").files[0];if(!file)return show("Select an invoice or receipt.",false);if(file.size>10485760)return show("The document must be 10 MB or smaller.",false);const allowed=["application/pdf","image/jpeg","image/png","image/webp"];if(!allowed.includes(file.type))return show("Only PDF, JPG, PNG or WebP files are allowed.",false);setBusy(true,"Creating expense record...");const payload={transaction_type:"Expense",transaction_date:el("expenseDate").value,category:el("category").value,amount:Number(el("amount").value),payment_method:el("paymentMethod").value,person_name:el("payee").value.trim(),reference:clean(el("reference").value),description:el("description").value.trim(),status:"Pending"};const tx=await supabaseClient.from("finance_transactions").insert(payload).select().single();if(tx.error){setBusy(false);return show(tx.error.message,false)}const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,"-");const path=`${new Date().getFullYear()}/${tx.data.id}/${Date.now()}-${safe}`;setBusy(true,"Uploading invoice or receipt...");const upload=await supabaseClient.storage.from("finance-documents").upload(path,file,{contentType:file.type,upsert:false});if(upload.error){await supabaseClient.from("finance_transactions").delete().eq("id",tx.data.id);setBusy(false);return show(upload.error.message,false)}const doc=await supabaseClient.from("finance_expense_documents").insert({transaction_id:tx.data.id,storage_path:path,original_name:file.name,mime_type:file.type,file_size:file.size});if(doc.error){await supabaseClient.storage.from("finance-documents").remove([path]);await supabaseClient.from("finance_transactions").delete().eq("id",tx.data.id);setBusy(false);return show(doc.error.message,false)}el("expenseForm").reset();el("expenseDate").value=new Date().toISOString().slice(0,10);setBusy(false);show(`Expense ${tx.data.receipt_number} submitted for approval.`,true);await loadExpenses()}
async function loadExpenses(){const box=el("pageStatus");const {data,error}=await supabaseClient.from("finance_transactions").select("*,documents:finance_expense_documents(*)").eq("transaction_type","Expense").order("created_at",{ascending:false});if(error){box.textContent=error.message;box.className="mb-4 text-sm font-bold text-red-600";return}expenses=data||[];box.textContent="";stats();render()}
function stats(){el("pendingCount").textContent=expenses.filter(x=>x.status==="Pending").length;el("approvedTotal").textContent=money(expenses.filter(x=>x.status==="Approved").reduce((n,x)=>n+Number(x.amount),0));el("voidedCount").textContent=expenses.filter(x=>x.status==="Voided").length}
function render(){const q=el("searchBox").value.toLowerCase(),st=el("statusFilter").value,items=expenses.filter(x=>(st==="all"||x.status===st)&&[x.receipt_number,x.person_name,x.category,x.reference,x.description].join(" ").toLowerCase().includes(q));el("expenseList").innerHTML=items.length?items.map(x=>{const doc=x.documents?.[0];return `<article class="expense-card"><div class="flex flex-col lg:flex-row justify-between gap-4"><div><div class="flex items-center gap-2"><span class="badge ${statusClass(x.status)}">${esc(x.status)}</span><span class="text-[10px] font-black text-slate-400">${esc(x.receipt_number)}</span></div><h3 class="text-lg font-black mt-3">${esc(x.person_name||"Unnamed Payee")}</h3><p class="text-sm text-slate-500">${esc(x.category)} · ${esc(x.transaction_date)} · ${esc(x.payment_method)}</p><p class="text-xs text-slate-400 mt-2">${esc(x.description||"")}</p></div><div class="lg:text-right"><p class="text-2xl font-black text-red-600">${money(x.amount)}</p><p class="text-xs text-slate-400">${esc(x.reference||"No reference")}</p></div></div><div class="mt-5 flex flex-wrap gap-2">${doc?`<button onclick="openDocument('${doc.storage_path}')" class="btn bg-blue-50 text-blue-700"><i class="fas fa-file mr-2"></i>${esc(doc.original_name)}</button>`:'<span class="text-xs text-red-500">Document missing</span>'}${x.status==="Pending"?`<button onclick="changeStatus('${x.id}','Approved')" class="btn bg-green-50 text-green-700">Approve</button>`:""}${x.status!=="Voided"?`<button onclick="changeStatus('${x.id}','Voided')" class="btn bg-amber-50 text-amber-700">Void</button>`:""}<button onclick="deleteExpense('${x.id}')" class="btn bg-red-50 text-red-700">Delete</button></div></article>`}).join(""):'<div class="panel text-center text-slate-400 font-bold">No expenses found.</div>'}
async function openDocument(path){const {data,error}=await supabaseClient.storage.from("finance-documents").createSignedUrl(path,300);if(error)return alert(error.message);open(data.signedUrl,"_blank","noopener")}
async function changeStatus(id,status){if(!confirm(`${status} this expense?`))return;const session=await supabaseClient.auth.getSession(),patch={status,approved_by:status==="Approved"?session.data.session?.user?.email:null,approved_at:status==="Approved"?new Date().toISOString():null};const {error}=await supabaseClient.from("finance_transactions").update(patch).eq("id",id);if(error)return alert(error.message);await loadExpenses()}
async function deleteExpense(id){if(!confirm("Delete this expense and its document permanently?"))return;const x=expenses.find(e=>e.id===id),paths=(x?.documents||[]).map(d=>d.storage_path);if(paths.length){const removed=await supabaseClient.storage.from("finance-documents").remove(paths);if(removed.error)return alert(removed.error.message)}const {error}=await supabaseClient.from("finance_transactions").delete().eq("id",id);if(error)return alert(error.message);await loadExpenses()}
function setBusy(v,text=""){el("saveBtn").disabled=v;el("uploadProgress").classList.toggle("hidden",!v);el("progressText").textContent=text;el("progressBar").style.width=v?"70%":"0%"}function show(m,ok){el("formStatus").textContent=m;el("formStatus").className=`rounded-xl p-3 text-sm font-bold ${ok?"bg-green-50 text-green-700":"bg-red-50 text-red-700"}`}function statusClass(s){return s==="Approved"?"bg-green-100 text-green-700":s==="Voided"?"bg-slate-200 text-slate-600":"bg-amber-100 text-amber-700"}function money(v){return new Intl.NumberFormat("en-NA",{style:"currency",currency:"NAD"}).format(Number(v||0))}function clean(v){v=String(v||"").trim();return v||null}function esc(v){return String(v||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
</script><style>.badge{display:inline-block;padding:.35rem .65rem;border-radius:99px;font-size:.58rem;font-weight:900;text-transform:uppercase;letter-spacing:.08em}</style></body></html>
