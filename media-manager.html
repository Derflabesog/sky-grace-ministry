﻿<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Media Manager | Sky Grace Admin</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
</head>

<body class="bg-slate-50 min-h-screen text-slate-900">

  <div id="admin-sidebar-mount"></div>
  <script src="admin-sidebar.js" defer></script>

  <main class="md:ml-72 p-8">
    <header class="mb-8">
      <p class="text-[11px] font-black uppercase tracking-[0.25em] text-blue-600">
        Admin Media
      </p>

      <h1 class="text-3xl font-black mt-2">
        Media Manager
      </h1>

      <p class="text-slate-500 text-sm mt-2">
        Add and manage sermons, videos, audio, PDFs, images, and announcement links.
      </p>
    </header>

    <section class="grid lg:grid-cols-3 gap-8">
      <div class="lg:col-span-1 bg-white rounded-3xl border border-slate-200 shadow-xl p-7">
        <h2 class="text-xl font-black mb-4">Add Media</h2>

        <form id="mediaForm" class="space-y-4">
          <div>
            <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-2">
              Title
            </label>
            <input
              id="mediaTitle"
              required
              type="text"
              placeholder="Example: Sunday Sermon"
              class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500"
            />
          </div>

          <div>
            <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-2">
              Media Type
            </label>
            <select
              id="mediaType"
              required
              class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500">
              <option value="">Select Type</option>
              <option value="sermon">Sermon</option>
              <option value="video">Video</option>
              <option value="audio">Audio</option>
              <option value="image">Image</option>
              <option value="pdf">PDF</option>
              <option value="announcement">Announcement</option>
            </select>
          </div>

          <div>
            <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-2">
              Media URL
            </label>
            <input
              id="mediaUrl"
              required
              type="url"
              placeholder="https://..."
              class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500"
            />
          </div>

          <div>
            <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-2">
              Description
            </label>
            <textarea
              id="mediaDescription"
              rows="4"
              placeholder="Short description..."
              class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500"></textarea>
          </div>

          <button
            id="mediaSubmitBtn"
            type="submit"
            class="w-full bg-blue-600 text-white py-4 rounded-xl text-xs font-black uppercase tracking-widest hover:bg-blue-500 transition">
            <i class="fas fa-plus mr-2"></i>
            Add Media
          </button>

          <p id="mediaStatus" class="text-sm font-bold min-h-[1.25rem]"></p>
        </form>
      </div>

      <div class="lg:col-span-2 bg-white rounded-3xl border border-slate-200 shadow-xl overflow-hidden">
        <div class="p-6 border-b border-slate-100 flex flex-col md:flex-row md:items-center justify-between gap-4">
          <div>
            <h2 class="text-xl font-black">Media Library</h2>
            <p id="mediaCount" class="text-xs font-bold text-slate-400 uppercase tracking-widest mt-1">
              Loading media...
            </p>
          </div>

          <div class="relative">
            <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            <input
              id="mediaSearch"
              type="text"
              placeholder="Search media..."
              class="border border-slate-200 rounded-xl pl-10 pr-4 py-3 text-xs font-bold focus:outline-none focus:border-blue-500"
            />
          </div>
        </div>

        <div id="mediaList" class="divide-y divide-slate-100">
          <div class="p-6 text-sm text-slate-500 font-bold">
            Loading media...
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase.js"></script>

  <script>
    let allMedia = [];

    document.addEventListener("DOMContentLoaded", async () => {
      const form = document.getElementById("mediaForm");
      form.addEventListener("submit", addMedia);

      document.getElementById("mediaSearch").addEventListener("input", function () {
        const term = this.value.toLowerCase();

        const filtered = allMedia.filter((item) =>
          String(item.title || "").toLowerCase().includes(term) ||
          String(item.media_type || "").toLowerCase().includes(term) ||
          String(item.media_url || "").toLowerCase().includes(term) ||
          String(item.description || "").toLowerCase().includes(term)
        );

        renderMedia(filtered);
      });

      await loadMedia();
    });

    async function loadMedia() {
      const list = document.getElementById("mediaList");
      const count = document.getElementById("mediaCount");

      if (!window.supabaseClient) {
        list.innerHTML = `<div class="p-6 text-red-600 font-bold">Supabase is not connected.</div>`;
        return;
      }

      const { data, error } = await supabaseClient
        .from("media_items")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        list.innerHTML = `<div class="p-6 text-red-600 font-bold">${escapeHtml(error.message)}</div>`;
        return;
      }

      allMedia = data || [];
      count.textContent = `${allMedia.length} media item(s)`;
      renderMedia(allMedia);
    }

    function renderMedia(items) {
      const list = document.getElementById("mediaList");
      const count = document.getElementById("mediaCount");

      count.textContent = `${items.length} media item(s)`;

      if (!items.length) {
        list.innerHTML = `
          <div class="p-8 text-center text-slate-400 font-bold">
            No media items found.
          </div>
        `;
        return;
      }

      list.innerHTML = items.map((item) => `
        <div class="p-6 flex flex-col md:flex-row md:items-center justify-between gap-5 hover:bg-slate-50 transition">
          <div class="flex gap-4">
            <div class="w-12 h-12 rounded-2xl bg-blue-100 text-blue-600 flex items-center justify-center flex-shrink-0">
              <i class="${getIcon(item.media_type)}"></i>
            </div>

            <div>
              <div class="flex flex-wrap items-center gap-2">
                <h3 class="font-black text-slate-900">
                  ${escapeHtml(item.title || "Untitled")}
                </h3>

                <span class="px-3 py-1 rounded-full bg-slate-100 text-slate-500 text-[10px] font-black uppercase tracking-widest">
                  ${escapeHtml(item.media_type || "media")}
                </span>
              </div>

              <p class="text-sm text-slate-500 mt-1">
                ${escapeHtml(item.description || "")}
              </p>

              <a href="${escapeAttribute(item.media_url || "#")}" target="_blank" rel="noopener"
                class="inline-block mt-2 text-xs font-bold text-blue-600 hover:underline">
                Open Media Link
              </a>

              <p class="text-[10px] text-slate-400 mt-2">
                ${item.created_at ? new Date(item.created_at).toLocaleString() : ""}
              </p>
            </div>
          </div>

          <button onclick="deleteMedia('${item.id}')"
            class="px-4 py-2 rounded-xl bg-red-600 text-white text-xs font-black uppercase tracking-widest hover:bg-red-500 transition">
            Delete
          </button>
        </div>
      `).join("");
    }

    async function addMedia(e) {
      e.preventDefault();

      const title = document.getElementById("mediaTitle").value.trim();
      const media_type = document.getElementById("mediaType").value;
      const media_url = document.getElementById("mediaUrl").value.trim();
      const description = document.getElementById("mediaDescription").value.trim();
      const status = document.getElementById("mediaStatus");
      const submitBtn = document.getElementById("mediaSubmitBtn");

      if (!title || !media_type || !media_url) {
        status.textContent = "Please complete title, type, and URL.";
        status.className = "text-sm font-bold text-red-600";
        return;
      }

      status.textContent = "Adding media...";
      status.className = "text-sm font-bold text-blue-600";

      submitBtn.disabled = true;
      submitBtn.classList.add("opacity-70");

      const { error } = await supabaseClient
        .from("media_items")
        .insert([
          {
            title,
            media_type,
            media_url,
            description
          }
        ]);

      submitBtn.disabled = false;
      submitBtn.classList.remove("opacity-70");

      if (error) {
        console.error("Media insert error:", error);
        status.textContent = error.message;
        status.className = "text-sm font-bold text-red-600";
        return;
      }

      status.textContent = "Media added successfully.";
      status.className = "text-sm font-bold text-green-600";

      document.getElementById("mediaForm").reset();
      await loadMedia();
    }

    async function deleteMedia(id) {
      if (!confirm("Delete this media item?")) return;

      const { error } = await supabaseClient
        .from("media_items")
        .delete()
        .eq("id", id);

      if (error) {
        alert(error.message);
        return;
      }

      await loadMedia();
    }

    function getIcon(type) {
      const icons = {
        sermon: "fas fa-church",
        video: "fas fa-video",
        audio: "fas fa-music",
        image: "fas fa-image",
        pdf: "fas fa-file-pdf",
        announcement: "fas fa-bullhorn"
      };

      return icons[type] || "fas fa-file";
    }

    function escapeHtml(str) {
      return String(str || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttribute(str) {
      return String(str || "")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
