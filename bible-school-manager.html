<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bible School | Sky Grace Admin</title><script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"></head><body class="bg-slate-50 flex min-h-screen"><div id="admin-sidebar-mount"></div><script src="admin-sidebar.js" defer></script><div class="flex-1 min-w-0"><header class="h-16 bg-white border-b px-8 flex items-center justify-between sticky top-0 z-30"><div><h1 class="font-black">Bible School Management</h1><p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Courses, students, progress and certification</p></div><button onclick="exportEnrollments()" class="btn bg-green-600 text-white"><i class="fas fa-file-csv mr-2"></i>Export Students</button></header>
<main class="p-6 lg:p-8 max-w-[1600px] mx-auto"><section class="grid xl:grid-cols-[390px_1fr] gap-7 items-start"><form id="courseForm" class="panel space-y-5 xl:sticky xl:top-24"><input id="editingId" type="hidden"><div><h2 class="text-xl font-black">Create Bible Course</h2><p class="sub">Set the instructor, schedule, fees and capacity.</p></div><div><label class="label">Course Name *</label><input id="courseName" required class="field" placeholder="e.g. Foundations of Faith"></div><div class="grid grid-cols-2 gap-4"><div><label class="label">Level *</label><select id="courseLevel" class="field"><option>Foundation</option><option>Certificate</option><option>Diploma</option><option>Advanced</option><option>Leadership</option></select></div><div><label class="label">Instructor *</label><input id="instructorName" required class="field"></div></div><div class="grid grid-cols-2 gap-4"><div><label class="label">Start Date *</label><input id="startDate" required type="date" class="field"></div><div><label class="label">End Date</label><input id="endDate" type="date" class="field"></div></div><div class="grid grid-cols-2 gap-4"><div><label class="label">Class Day</label><select id="scheduleDay" class="field"><option value="">Not set</option><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option></select></div><div><label class="label">Class Time</label><input id="scheduleTime" type="time" class="field"></div></div><div><label class="label">Location *</label><input id="location" required class="field" value="Okahandja HQ"></div><div class="grid grid-cols-2 gap-4"><div><label class="label">Maximum Students</label><input id="maximumStudents" type="number" min="1" class="field"></div><div><label class="label">Tuition (N$)</label><input id="tuitionAmount" type="number" min="0" step="0.01" value="0" class="field"></div></div><div><label class="label">Description</label><textarea id="description" rows="3" class="field"></textarea></div><div><label class="label">Course Status</label><select id="courseStatus" class="field"><option>Draft</option><option selected>Open</option><option>In Progress</option><option>Completed</option><option>Cancelled</option></select></div><div><label class="label">Notes</label><textarea id="notes" rows="2" class="field"></textarea></div><p id="formStatus" class="hidden rounded-xl p-3 text-sm font-bold"></p><div class="flex gap-3"><button id="saveBtn" class="btn bg-amber-600 text-white flex-1"><i class="fas fa-book-bible mr-2"></i>Save Course</button><button type="button" onclick="resetForm()" class="btn bg-slate-100 text-slate-600">Clear</button></div></form>
<div><section class="grid sm:grid-cols-4 gap-4 mb-5"><div class="stat"><small>Total Courses</small><strong id="totalCourses">0</strong></div><div class="stat"><small>Open Courses</small><strong id="openCourses" class="text-green-600">0</strong></div><div class="stat"><small>Enrolments</small><strong id="totalEnrollments" class="text-amber-600">0</strong></div><div class="stat"><small>Completed</small><strong id="completedStudents" class="text-blue-600">0</strong></div></section><div class="grid md:grid-cols-[1fr_190px] gap-3 mb-4"><input id="searchBox" class="field" placeholder="Search course, instructor, level..."><select id="statusFilter" class="field"><option value="all">All statuses</option><option>Draft</option><option>Open</option><option>In Progress</option><option>Completed</option><option>Cancelled</option></select></div><p id="pageStatus" class="mb-4 text-sm font-bold text-slate-500">Loading Bible School...</p><div id="courseList" class="grid lg:grid-cols-2 gap-4"></div></div></section></main></div>
<div id="rosterModal" class="fixed inset-0 bg-slate-950/60 hidden items-center justify-center z-50 p-5"><div class="bg-white rounded-3xl w-full max-w-5xl max-h-[90vh] overflow-y-auto p-7 relative"><button onclick="closeRoster()" class="absolute right-6 top-6 text-slate-400"><i class="fas fa-times text-xl"></i></button><h2 id="rosterTitle" class="text-2xl font-black">Course Students</h2><p id="rosterMeta" class="sub mt-1"></p><form id="enrollmentForm" class="grid md:grid-cols-[1fr_180px_auto] gap-3 mt-6"><select id="memberId" required class="field"><option value="">Select member</option></select><select id="paymentStatus" class="field"><option>Not Required</option><option>Pending</option><option>Part Paid</option><option>Paid</option></select><button class="btn bg-amber-600 text-white"><i class="fas fa-user-graduate mr-2"></i>Enrol</button></form><p id="rosterStatus" class="mt-4 text-sm font-bold"></p><div id="rosterList" class="mt-5 space-y-3"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase.js"></script><script src="assets/js/guard.js"></script><style>.panel,.stat,.course-card{background:#fff;border:1px solid #e2e8f0;border-radius:1rem;padding:1.25rem}.label,.stat small{display:block;margin-bottom:.4rem;font-size:.61rem;font-weight:900;text-transform:uppercase;letter-spacing:.1em;color:#94a3b8}.field{width:100%;background:#f8fafc;border:1px solid #e2e8f0;border-radius:.75rem;padding:.78rem .95rem;font-size:.78rem;font-weight:700}.btn{border-radius:.75rem;padding:.78rem 1rem;font-size:.67rem;font-weight:900;text-transform:uppercase;letter-spacing:.06em}.sub{font-size:.75rem;color:#64748b}.stat strong{display:block;font-size:1.5rem;margin-top:.4rem}.badge{padding:.35rem .65rem;border-radius:99px;font-size:.56rem;font-weight:900;text-transform:uppercase}</style>
<script>
let courses=[],enrollments=[],members=[],selectedCourse=null;const el=id=>document.getElementById(id);document.addEventListener("DOMContentLoaded",()=>{el("courseForm").onsubmit=saveCourse;el("enrollmentForm").onsubmit=enrolMember;el("searchBox").oninput=render;el("statusFilter").onchange=render;loadAll()});async function loadAll(){const box=el("pageStatus"),[c,e,m]=await Promise.all([supabaseClient.from("bible_school_courses").select("*").order("start_date",{ascending:false}),supabaseClient.from("bible_school_enrollments").select("*,member:members(id,member_number,full_name,phone,email)"),supabaseClient.from("members").select("id,member_number,full_name,phone").eq("membership_status","Active").order("full_name")]);if(c.error||e.error||m.error){box.textContent=(c.error||e.error||m.error).message;box.className="mb-4 text-sm font-bold text-red-600";return}courses=c.data||[];enrollments=e.data||[];members=m.data||[];box.textContent="";stats();render()}function money(v){return Number(v||0).toLocaleString("en-NA",{style:"currency",currency:"NAD"})}function stats(){el("totalCourses").textContent=courses.length;el("openCourses").textContent=courses.filter(x=>["Open","In Progress"].includes(x.status)).length;el("totalEnrollments").textContent=enrollments.filter(x=>x.enrollment_status!=="Withdrawn").length;el("completedStudents").textContent=enrollments.filter(x=>x.enrollment_status==="Completed").length}
function render(){const q=el("searchBox").value.toLowerCase(),st=el("statusFilter").value,items=courses.filter(x=>(st==="all"||x.status===st)&&[x.course_number,x.course_name,x.course_level,x.instructor_name,x.location].join(" ").toLowerCase().includes(q));el("courseList").innerHTML=items.length?items.map(x=>{const enrolled=enrollments.filter(e=>e.course_id===x.id&&e.enrollment_status!=="Withdrawn").length,full=x.maximum_students&&enrolled>=x.maximum_students;return `<article class="course-card"><div class="flex justify-between gap-3"><div><div class="flex gap-2"><span class="badge ${x.status==="Open"?"bg-green-100 text-green-700":"bg-slate-200 text-slate-600"}">${esc(x.status)}</span><span class="text-[9px] font-black text-slate-400">${esc(x.course_number)}</span></div><h3 class="text-lg font-black mt-3">${esc(x.course_name)}</h3><p class="text-xs text-amber-600 font-bold">${esc(x.course_level)} · ${esc(x.instructor_name)}</p></div><div class="text-right"><p class="text-2xl font-black ${full?"text-red-600":"text-amber-600"}">${enrolled}${x.maximum_students?`/${x.maximum_students}`:""}</p><p class="sub">students</p></div></div><div class="mt-4 grid grid-cols-2 gap-3 text-xs"><p><span class="text-slate-400">Dates:</span><br><b>${esc(x.start_date)}${x.end_date?` – ${esc(x.end_date)}`:""}</b></p><p><span class="text-slate-400">Schedule:</span><br><b>${esc(x.schedule_day||"Not set")} ${esc(String(x.schedule_time||"").slice(0,5))}</b></p><p><span class="text-slate-400">Location:</span><br><b>${esc(x.location)}</b></p><p><span class="text-slate-400">Tuition:</span><br><b>${money(x.tuition_amount)}</b></p></div><div class="mt-4 flex flex-wrap gap-2"><button onclick="openRoster('${x.id}')" class="btn bg-amber-50 text-amber-700">Students</button><button onclick="editCourse('${x.id}')" class="btn bg-blue-50 text-blue-700">Edit</button><button onclick="deleteCourse('${x.id}')" class="btn bg-red-50 text-red-700">Delete</button></div></article>`}).join(""):'<div class="panel lg:col-span-2 text-center text-slate-400 font-bold">No Bible School courses found.</div>'}
async function saveCourse(e){e.preventDefault();const payload={course_name:el("courseName").value.trim(),course_level:el("courseLevel").value,instructor_name:el("instructorName").value.trim(),start_date:el("startDate").value,end_date:el("endDate").value||null,schedule_day:clean(el("scheduleDay").value),schedule_time:el("scheduleTime").value||null,location:el("location").value.trim(),maximum_students:el("maximumStudents").value?Number(el("maximumStudents").value):null,tuition_amount:Number(el("tuitionAmount").value||0),description:clean(el("description").value),status:el("courseStatus").value,notes:clean(el("notes").value)},id=el("editingId").value,r=id?await supabaseClient.from("bible_school_courses").update(payload).eq("id",id):await supabaseClient.from("bible_school_courses").insert(payload);if(r.error)return show(r.error.message,false);show(id?"Course updated.":"Course created.",true);resetForm();await loadAll()}function editCourse(id){const x=courses.find(v=>v.id===id);if(!x)return;el("editingId").value=x.id;el("courseName").value=x.course_name;el("courseLevel").value=x.course_level;el("instructorName").value=x.instructor_name;el("startDate").value=x.start_date;el("endDate").value=x.end_date||"";el("scheduleDay").value=x.schedule_day||"";el("scheduleTime").value=x.schedule_time||"";el("location").value=x.location;el("maximumStudents").value=x.maximum_students||"";el("tuitionAmount").value=x.tuition_amount;el("description").value=x.description||"";el("courseStatus").value=x.status;el("notes").value=x.notes||"";el("saveBtn").innerHTML='<i class="fas fa-floppy-disk mr-2"></i>Update Course';scrollTo({top:0,behavior:"smooth"})}async function deleteCourse(id){if(!confirm("Delete this course and all enrolments permanently?"))return;const {error}=await supabaseClient.from("bible_school_courses").delete().eq("id",id);if(error)return alert(error.message);await loadAll()}
function openRoster(id){selectedCourse=courses.find(x=>x.id===id);if(!selectedCourse)return;el("rosterTitle").textContent=selectedCourse.course_name;el("rosterMeta").textContent=`${selectedCourse.course_number} · Instructor: ${selectedCourse.instructor_name}`;buildMemberOptions();renderRoster();el("rosterModal").classList.remove("hidden");el("rosterModal").classList.add("flex")}function closeRoster(){el("rosterModal").classList.add("hidden");el("rosterModal").classList.remove("flex");selectedCourse=null}function buildMemberOptions(){const assigned=new Set(enrollments.filter(x=>x.course_id===selectedCourse.id).map(x=>x.member_id));el("memberId").innerHTML='<option value="">Select active member</option>'+members.filter(x=>!assigned.has(x.id)).map(x=>`<option value="${x.id}">${esc(x.full_name)} · ${esc(x.member_number||"")}</option>`).join("")}function renderRoster(){const rows=enrollments.filter(x=>x.course_id===selectedCourse.id);el("rosterList").innerHTML=rows.length?rows.map(x=>`<div class="border rounded-2xl p-4"><div class="flex justify-between gap-3"><div><b>${esc(x.member?.full_name||"Student")}</b><p class="sub">${esc(x.member?.member_number||"")} · ${esc(x.enrollment_status)} · Payment: ${esc(x.payment_status)}</p></div><b class="text-amber-600">${x.progress_percent}%</b></div><div class="mt-3 grid grid-cols-[1fr_150px_120px_auto] gap-2"><input id="progress-${x.id}" type="number" min="0" max="100" value="${x.progress_percent}" class="field"><select id="status-${x.id}" class="field"><option ${x.enrollment_status==="Enrolled"?"selected":""}>Enrolled</option><option ${x.enrollment_status==="In Progress"?"selected":""}>In Progress</option><option ${x.enrollment_status==="Completed"?"selected":""}>Completed</option><option ${x.enrollment_status==="Withdrawn"?"selected":""}>Withdrawn</option></select><input id="grade-${x.id}" value="${esc(x.final_grade||"")}" class="field" placeholder="Grade"><button onclick="updateEnrollment('${x.id}')" class="btn bg-blue-50 text-blue-700">Update</button></div></div>`).join(""):'<p class="text-center text-slate-400 font-bold py-8">No students enrolled.</p>'}
async function enrolMember(e){e.preventDefault();if(!selectedCourse)return;const count=enrollments.filter(x=>x.course_id===selectedCourse.id&&x.enrollment_status!=="Withdrawn").length;if(selectedCourse.maximum_students&&count>=selectedCourse.maximum_students)return el("rosterStatus").textContent="This course has reached maximum capacity.";const {error}=await supabaseClient.from("bible_school_enrollments").insert({course_id:selectedCourse.id,member_id:el("memberId").value,payment_status:el("paymentStatus").value});if(error){el("rosterStatus").textContent=error.message;return}el("rosterStatus").textContent="Student enrolled.";await reloadRoster()}async function updateEnrollment(id){const progress=Number(el(`progress-${id}`).value),status=el(`status-${id}`).value,grade=clean(el(`grade-${id}`).value),{error}=await supabaseClient.from("bible_school_enrollments").update({progress_percent:progress,enrollment_status:status,final_grade:grade,certificate_issued:status==="Completed"}).eq("id",id);if(error)return alert(error.message);await reloadRoster()}async function reloadRoster(){const id=selectedCourse.id;await loadAll();selectedCourse=courses.find(x=>x.id===id);buildMemberOptions();renderRoster()}
function resetForm(){el("courseForm").reset();el("editingId").value="";el("location").value="Okahandja HQ";el("tuitionAmount").value="0";el("courseStatus").value="Open";el("saveBtn").innerHTML='<i class="fas fa-book-bible mr-2"></i>Save Course'}function exportEnrollments(){const rows=[["Course","Course Number","Student","Member Number","Status","Progress","Grade","Payment","Certificate"],...enrollments.map(x=>{const c=courses.find(v=>v.id===x.course_id);return[c?.course_name,c?.course_number,x.member?.full_name,x.member?.member_number,x.enrollment_status,x.progress_percent,x.final_grade,x.payment_status,x.certificate_issued?"Yes":"No"]})],csv=rows.map(r=>r.map(v=>'"'+String(v??"").replaceAll('"','""')+'"').join(",")).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="sky-grace-bible-school-students.csv";a.click();URL.revokeObjectURL(a.href)}function show(m,ok){el("formStatus").textContent=m;el("formStatus").className=`rounded-xl p-3 text-sm font-bold ${ok?"bg-green-50 text-green-700":"bg-red-50 text-red-700"}`}function clean(v){v=String(v||"").trim();return v||null}function esc(v){return String(v||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
</script></body></html>
