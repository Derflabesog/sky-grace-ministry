<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asset Manager | Sky Grace Admin</title><script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"></head><body class="bg-slate-50 flex min-h-screen"><div id="admin-sidebar-mount"></div><script src="admin-sidebar.js" defer></script><div class="flex-1 min-w-0"><header class="h-16 bg-white border-b px-8 flex items-center justify-between sticky top-0 z-30"><div><h1 class="font-black">Church Assets & Inventory</h1><p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Equipment, property and ministry resources</p></div><button onclick="exportCsv()" class="btn bg-green-600 text-white"><i class="fas fa-file-csv mr-2"></i>Export CSV</button></header>
<main class="p-6 lg:p-8 max-w-[1600px] mx-auto"><section class="grid xl:grid-cols-[420px_1fr] gap-7 items-start"><form id="assetForm" class="panel space-y-5 xl:sticky xl:top-24"><input id="editingId" type="hidden"><div><h2 class="text-xl font-black">Register Asset</h2><p class="sub">Record church equipment, furniture, vehicles, property, or technology.</p></div><div><label class="label">Asset Name *</label><input id="assetName" required class="field" placeholder="e.g. Main sanctuary projector"></div><div class="grid grid-cols-2 gap-4"><div><label class="label">Category *</label><select id="category" class="field"><option>Audio Equipment</option><option>Media Equipment</option><option>Musical Instrument</option><option>Furniture</option><option>Computer & IT</option><option>Vehicle</option><option>Building & Property</option><option>Kitchen Equipment</option><option>Office Equipment</option><option>Other</option></select></div><div><label class="label">Condition *</label><select id="assetCondition" class="field"><option>Excellent</option><option selected>Good</option><option>Fair</option><option>Poor</option><option>Damaged</option></select></div></div><div><label class="label">Description</label><textarea id="description" rows="2" class="field"></textarea></div><div class="grid grid-cols-2 gap-4"><div><label class="label">Serial Number</label><input id="serialNumber" class="field"></div><div><label class="label">Purchase Date</label><input id="purchaseDate" type="date" class="field"></div></div><div class="grid grid-cols-2 gap-4"><div><label class="label">Purchase Value (N$)</label><input id="purchaseValue" type="number" min="0" step="0.01" class="field"></div><div><label class="label">Current Value (N$)</label><input id="currentValue" type="number" min="0" step="0.01" class="field"></div></div><div class="grid grid-cols-2 gap-4"><div><label class="label">Location</label><input id="location" class="field" placeholder="Room / branch"></div><div><label class="label">Custodian</label><input id="assignedTo" class="field" placeholder="Responsible person"></div></div><div class="grid grid-cols-2 gap-4"><div><label class="label">Supplier</label><input id="supplier" class="field"></div><div><label class="label">Warranty Expiry</label><input id="warrantyExpiry" type="date" class="field"></div></div><div><label class="label">Next Maintenance</label><input id="nextMaintenance" type="date" class="field"></div><div><label class="label">Notes</label><textarea id="notes" rows="2" class="field"></textarea></div><p id="formStatus" class="hidden rounded-xl p-3 text-sm font-bold"></p><div class="flex gap-3"><button id="saveBtn" class="btn bg-blue-600 text-white flex-1"><i class="fas fa-floppy-disk mr-2"></i>Save Asset</button><button type="button" onclick="resetForm()" class="btn bg-slate-100 text-slate-600">Clear</button></div></form>
<div><section class="grid sm:grid-cols-2 xl:grid-cols-4 gap-4 mb-5"><div class="stat"><small>Total Assets</small><strong id="totalAssets">0</strong></div><div class="stat"><small>Current Value</small><strong id="totalValue" class="text-green-600">N$ 0.00</strong></div><div class="stat"><small>Maintenance Due</small><strong id="maintenanceDue" class="text-amber-500">0</strong></div><div class="stat"><small>Attention Needed</small><strong id="attentionCount" class="text-red-600">0</strong></div></section><div class="grid md:grid-cols-[1fr_180px_180px] gap-3 mb-4"><input id="searchBox" class="field" placeholder="Search assets, serial number, custodian..."><select id="categoryFilter" class="field"><option value="all">All categories</option></select><select id="statusFilter" class="field"><option value="all">All statuses</option><option>Active</option><option>In Maintenance</option><option>Retired</option><option>Disposed</option><option>Lost</option></select></div><p id="pageStatus" class="mb-4 text-sm font-bold text-slate-500">Loading assets...</p><div id="assetList" class="grid lg:grid-cols-2 gap-4"></div></div></section></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase.js"></script><script src="assets/js/guard.js"></script><style>.panel,.stat,.asset-card{background:#fff;border:1px solid #e2e8f0;border-radius:1rem;padding:1.25rem}.label,.stat small{display:block;margin-bottom:.4rem;font-size:.61rem;font-weight:900;text-transform:uppercase;letter-spacing:.1em;color:#94a3b8}.field{width:100%;background:#f8fafc;border:1px solid #e2e8f0;border-radius:.75rem;padding:.78rem .95rem;font-size:.78rem;font-weight:700}.btn{border-radius:.75rem;padding:.78rem 1rem;font-size:.67rem;font-weight:900;text-transform:uppercase;letter-spacing:.06em}.sub{font-size:.75rem;color:#64748b}.stat strong{display:block;font-size:1.5rem;margin-top:.4rem}.badge{padding:.35rem .6rem;border-radius:99px;font-size:.56rem;font-weight:900;text-transform:uppercase}</style>
<script>
let assets=[];const el=id=>document.getElementById(id);document.addEventListener("DOMContentLoaded",()=>{el("assetForm").onsubmit=saveAsset;el("searchBox").oninput=render;el("categoryFilter").onchange=render;el("statusFilter").onchange=render;loadAssets()});
async function loadAssets(){const box=el("pageStatus"),{data,error}=await supabaseClient.from("church_assets").select("*").order("created_at",{ascending:false});if(error){box.textContent=error.message;box.className="mb-4 text-sm font-bold text-red-600";return}assets=data||[];box.textContent="";buildCategories();stats();render()}
function buildCategories(){const values=[...new Set(assets.map(x=>x.category))].sort(),old=el("categoryFilter").value;el("categoryFilter").innerHTML='<option value="all">All categories</option>'+values.map(x=>`<option>${esc(x)}</option>`).join("");if(values.includes(old))el("categoryFilter").value=old}
function stats(){const today=new Date().toISOString().slice(0,10);el("totalAssets").textContent=assets.length;el("totalValue").textContent=money(assets.reduce((n,x)=>n+Number(x.current_value||0),0));el("maintenanceDue").textContent=assets.filter(x=>x.next_maintenance_date&&x.next_maintenance_date<=today&&x.status==="Active").length;el("attentionCount").textContent=assets.filter(x=>["Poor","Damaged"].includes(x.asset_condition)||["Lost","In Maintenance"].includes(x.status)).length}
function render(){const q=el("searchBox").value.toLowerCase(),cat=el("categoryFilter").value,st=el("statusFilter").value,today=new Date().toISOString().slice(0,10),items=assets.filter(x=>(cat==="all"||x.category===cat)&&(st==="all"||x.status===st)&&[x.asset_number,x.asset_name,x.category,x.serial_number,x.location,x.assigned_to,x.description].join(" ").toLowerCase().includes(q));el("assetList").innerHTML=items.length?items.map(x=>{const due=x.next_maintenance_date&&x.next_maintenance_date<=today&&x.status==="Active";return `<article class="asset-card"><div class="flex justify-between gap-3"><div><div class="flex gap-2 items-center"><span class="badge ${statusClass(x.status)}">${esc(x.status)}</span><span class="text-[9px] font-black text-slate-400">${esc(x.asset_number)}</span></div><h3 class="text-lg font-black mt-3">${esc(x.asset_name)}</h3><p class="text-xs text-slate-500">${esc(x.category)} · ${esc(x.asset_condition)}</p></div><p class="font-black text-green-600">${money(x.current_value)}</p></div><div class="mt-4 grid grid-cols-2 gap-3 text-xs"><p><span class="text-slate-400">Location:</span><br><b>${esc(x.location||"Not assigned")}</b></p><p><span class="text-slate-400">Custodian:</span><br><b>${esc(x.assigned_to||"Not assigned")}</b></p><p><span class="text-slate-400">Serial:</span><br><b>${esc(x.serial_number||"None")}</b></p><p class="${due?"text-red-600":""}"><span class="text-slate-400">Maintenance:</span><br><b>${esc(x.next_maintenance_date||"Not scheduled")}${due?" · DUE":""}</b></p></div><div class="mt-4 flex flex-wrap gap-2"><button onclick="editAsset('${x.id}')" class="btn bg-blue-50 text-blue-700">Edit</button><button onclick="setStatus('${x.id}','In Maintenance')" class="btn bg-amber-50 text-amber-700">Maintenance</button><button onclick="setStatus('${x.id}','Retired')" class="btn bg-slate-100 text-slate-700">Retire</button><button onclick="deleteAsset('${x.id}')" class="btn bg-red-50 text-red-700">Delete</button></div></article>`}).join(""):'<div class="panel lg:col-span-2 text-center text-slate-400 font-bold">No assets found.</div>'}
async function saveAsset(e){e.preventDefault();const payload={asset_name:el("assetName").value.trim(),category:el("category").value,description:clean(el("description").value),serial_number:clean(el("serialNumber").value),purchase_date:el("purchaseDate").value||null,purchase_value:num(el("purchaseValue").value),current_value:num(el("currentValue").value),asset_condition:el("assetCondition").value,location:clean(el("location").value),assigned_to:clean(el("assignedTo").value),supplier:clean(el("supplier").value),warranty_expiry:el("warrantyExpiry").value||null,next_maintenance_date:el("nextMaintenance").value||null,notes:clean(el("notes").value)},id=el("editingId").value;el("saveBtn").disabled=true;const result=id?await supabaseClient.from("church_assets").update(payload).eq("id",id):await supabaseClient.from("church_assets").insert(payload);el("saveBtn").disabled=false;if(result.error)return show(result.error.message,false);show(id?"Asset updated.":"Asset registered.",true);resetForm();await loadAssets()}
function editAsset(id){const x=assets.find(a=>a.id===id);if(!x)return;el("editingId").value=x.id;el("assetName").value=x.asset_name||"";el("category").value=x.category;el("description").value=x.description||"";el("serialNumber").value=x.serial_number||"";el("purchaseDate").value=x.purchase_date||"";el("purchaseValue").value=x.purchase_value??"";el("currentValue").value=x.current_value??"";el("assetCondition").value=x.asset_condition;el("location").value=x.location||"";el("assignedTo").value=x.assigned_to||"";el("supplier").value=x.supplier||"";el("warrantyExpiry").value=x.warranty_expiry||"";el("nextMaintenance").value=x.next_maintenance_date||"";el("notes").value=x.notes||"";el("saveBtn").innerHTML='<i class="fas fa-floppy-disk mr-2"></i>Update Asset';scrollTo({top:0,behavior:"smooth"})}
async function setStatus(id,status){if(!confirm(`Change this asset to ${status}?`))return;const {error}=await supabaseClient.from("church_assets").update({status}).eq("id",id);if(error)return alert(error.message);await loadAssets()}
async function deleteAsset(id){if(!confirm("Delete this asset permanently? Use Retire for assets that should remain in the audit history."))return;const {error}=await supabaseClient.from("church_assets").delete().eq("id",id);if(error)return alert(error.message);await loadAssets()}
function resetForm(){el("assetForm").reset();el("editingId").value="";el("assetCondition").value="Good";el("saveBtn").innerHTML='<i class="fas fa-floppy-disk mr-2"></i>Save Asset'}function exportCsv(){const data=[["Asset Number","Asset Name","Category","Condition","Status","Location","Custodian","Serial Number","Purchase Value","Current Value","Next Maintenance"],...assets.map(x=>[x.asset_number,x.asset_name,x.category,x.asset_condition,x.status,x.location,x.assigned_to,x.serial_number,x.purchase_value,x.current_value,x.next_maintenance_date])],csv=data.map(r=>r.map(v=>'"'+String(v??"").replaceAll('"','""')+'"').join(",")).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="sky-grace-assets.csv";a.click();URL.revokeObjectURL(a.href)}function show(m,ok){el("formStatus").textContent=m;el("formStatus").className=`rounded-xl p-3 text-sm font-bold ${ok?"bg-green-50 text-green-700":"bg-red-50 text-red-700"}`}function statusClass(s){return s==="Active"?"bg-green-100 text-green-700":s==="In Maintenance"?"bg-amber-100 text-amber-700":s==="Lost"?"bg-red-100 text-red-700":"bg-slate-200 text-slate-600"}function num(v){return v===""?null:Number(v)}function clean(v){v=String(v||"").trim();return v||null}function money(v){return new Intl.NumberFormat("en-NA",{style:"currency",currency:"NAD"}).format(Number(v||0))}function esc(v){return String(v||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
</script></body></html>
