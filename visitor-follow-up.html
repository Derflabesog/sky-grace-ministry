<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visitor Follow-up | Sky Grace Admin</title><script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"></head><body class="bg-slate-50 flex min-h-screen"><div id="admin-sidebar-mount"></div><script src="admin-sidebar.js" defer></script><div class="flex-1 min-w-0"><header class="h-16 bg-white border-b px-8 flex items-center justify-between sticky top-0 z-30"><div><h1 class="font-black">Visitor Follow-up</h1><p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Welcome, connect and care for every guest</p></div><button onclick="exportCsv()" class="btn bg-green-600 text-white"><i class="fas fa-file-csv mr-2"></i>Export CSV</button></header>
<main class="p-6 lg:p-8 max-w-[1600px] mx-auto"><section class="grid xl:grid-cols-[410px_1fr] gap-7 items-start"><form id="visitorForm" class="panel space-y-5 xl:sticky xl:top-24"><input id="editingId" type="hidden"><div><h2 class="text-xl font-black">Register Visitor</h2><p class="sub">Capture a guest and schedule caring follow-up.</p></div><div><label class="label">Full Name *</label><input id="fullName" required class="field"></div><div class="grid grid-cols-2 gap-4"><div><label class="label">Phone *</label><input id="phone" type="tel" required class="field" placeholder="+264..."></div><div><label class="label">Email</label><input id="email" type="email" class="field"></div></div><div class="grid grid-cols-2 gap-4"><div><label class="label">First Visit *</label><input id="firstVisitDate" type="date" required class="field"></div><div><label class="label">Branch *</label><select id="branch" class="field"><option>Okahandja HQ</option><option>Windhoek</option><option>Online</option><option>Other</option></select></div></div><div class="grid grid-cols-2 gap-4"><div><label class="label">Visit Type</label><select id="visitType" class="field"><option>First-Time Visitor</option><option>Returning Visitor</option><option>Event Guest</option><option>Online Guest</option></select></div><div><label class="label">Invited By</label><input id="invitedBy" class="field"></div></div><div><label class="label">Ministry Interest</label><select id="ministryInterest" class="field"><option value="">Not specified</option><option>Prayer & Spiritual Growth</option><option>Membership</option><option>Volunteer Service</option><option>Theology School</option><option>Youth Ministry</option><option>Children's Ministry</option><option>Worship & Music</option><option>Media Ministry</option></select></div><div><label class="label">Prayer Request</label><textarea id="prayerRequest" rows="2" class="field"></textarea></div><div class="grid grid-cols-2 gap-4"><div><label class="label">Assigned To</label><input id="assignedTo" class="field" placeholder="Follow-up worker"></div><div><label class="label">Next Follow-up</label><input id="nextFollowUpDate" type="date" class="field"></div></div><div><label class="label">Notes</label><textarea id="notes" rows="2" class="field"></textarea></div><p id="formStatus" class="hidden rounded-xl p-3 text-sm font-bold"></p><div class="flex gap-3"><button id="saveBtn" class="btn bg-blue-600 text-white flex-1"><i class="fas fa-user-plus mr-2"></i>Save Visitor</button><button type="button" onclick="resetForm()" class="btn bg-slate-100 text-slate-600">Clear</button></div></form>
<div><section class="grid sm:grid-cols-2 xl:grid-cols-4 gap-4 mb-5"><div class="stat"><small>Total Visitors</small><strong id="totalVisitors">0</strong></div><div class="stat"><small>New</small><strong id="newVisitors" class="text-blue-600">0</strong></div><div class="stat"><small>Follow-up Due</small><strong id="followUpDue" class="text-amber-500">0</strong></div><div class="stat"><small>Connected / Members</small><strong id="connectedVisitors" class="text-green-600">0</strong></div></section><div class="grid md:grid-cols-[1fr_200px] gap-3 mb-4"><input id="searchBox" class="field" placeholder="Search visitor, phone, interest, worker..."><select id="statusFilter" class="field"><option value="all">All statuses</option><option>New</option><option>Contacted</option><option>Follow-up Needed</option><option>Connected</option><option>Member</option><option>Do Not Contact</option></select></div><p id="pageStatus" class="mb-4 text-sm font-bold text-slate-500">Loading visitors...</p><div id="visitorList" class="space-y-4"></div></div></section></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase.js"></script><script src="assets/js/guard.js"></script><style>.panel,.stat,.visitor-card{background:#fff;border:1px solid #e2e8f0;border-radius:1rem;padding:1.25rem}.label,.stat small{display:block;margin-bottom:.4rem;font-size:.61rem;font-weight:900;text-transform:uppercase;letter-spacing:.1em;color:#94a3b8}.field{width:100%;background:#f8fafc;border:1px solid #e2e8f0;border-radius:.75rem;padding:.78rem .95rem;font-size:.78rem;font-weight:700}.btn{border-radius:.75rem;padding:.78rem 1rem;font-size:.67rem;font-weight:900;text-transform:uppercase;letter-spacing:.06em}.sub{font-size:.75rem;color:#64748b}.stat strong{display:block;font-size:1.5rem;margin-top:.4rem}.badge{padding:.35rem .65rem;border-radius:99px;font-size:.56rem;font-weight:900;text-transform:uppercase}</style>
<script>
let visitors=[];const el=id=>document.getElementById(id);document.addEventListener("DOMContentLoaded",()=>{el("firstVisitDate").value=new Date().toISOString().slice(0,10);el("visitorForm").onsubmit=saveVisitor;el("searchBox").oninput=render;el("statusFilter").onchange=render;loadVisitors()});
async function loadVisitors(){const box=el("pageStatus"),{data,error}=await supabaseClient.from("church_visitors").select("*").order("created_at",{ascending:false});if(error){box.textContent=error.message;box.className="mb-4 text-sm font-bold text-red-600";return}visitors=data||[];box.textContent="";stats();render()}
function stats(){const today=new Date().toISOString().slice(0,10);el("totalVisitors").textContent=visitors.length;el("newVisitors").textContent=visitors.filter(x=>x.follow_up_status==="New").length;el("followUpDue").textContent=visitors.filter(x=>x.next_follow_up_date&&x.next_follow_up_date<=today&&!["Connected","Member","Do Not Contact"].includes(x.follow_up_status)).length;el("connectedVisitors").textContent=visitors.filter(x=>["Connected","Member"].includes(x.follow_up_status)).length}
function render(){const q=el("searchBox").value.toLowerCase(),st=el("statusFilter").value,today=new Date().toISOString().slice(0,10),items=visitors.filter(x=>(st==="all"||x.follow_up_status===st)&&[x.visitor_number,x.full_name,x.phone,x.email,x.ministry_interest,x.assigned_to,x.invited_by].join(" ").toLowerCase().includes(q));el("visitorList").innerHTML=items.length?items.map(x=>{const due=x.next_follow_up_date&&x.next_follow_up_date<=today&&!["Connected","Member","Do Not Contact"].includes(x.follow_up_status),phone=String(x.phone||"").replace(/\D/g,"").replace(/^0/,"264");return `<article class="visitor-card ${due?"border-amber-300":""}"><div class="flex flex-col lg:flex-row justify-between gap-4"><div><div class="flex items-center gap-2"><span class="badge ${statusClass(x.follow_up_status)}">${esc(x.follow_up_status)}</span><span class="text-[9px] font-black text-slate-400">${esc(x.visitor_number)}</span>${due?'<span class="badge bg-red-100 text-red-700">Follow-up Due</span>':""}</div><h3 class="text-lg font-black mt-3">${esc(x.full_name)}</h3><p class="text-sm text-slate-500">${esc(x.phone)}${x.email?" · "+esc(x.email):""}</p><p class="text-xs text-slate-400 mt-1">Visited ${esc(x.first_visit_date)} · ${esc(x.branch)} · ${esc(x.visit_type)}</p></div><div class="lg:text-right text-xs"><p class="text-slate-400">Assigned to</p><b>${esc(x.assigned_to||"Unassigned")}</b><p class="text-slate-400 mt-2">Next follow-up</p><b class="${due?"text-red-600":""}">${esc(x.next_follow_up_date||"Not scheduled")}</b></div></div>${x.ministry_interest?`<p class="mt-4 text-xs"><b>Interest:</b> ${esc(x.ministry_interest)}</p>`:""}${x.prayer_request?`<div class="mt-3 bg-violet-50 text-violet-800 rounded-xl p-3 text-xs"><b>Prayer request:</b> ${esc(x.prayer_request)}</div>`:""}<div class="mt-4 flex flex-wrap gap-2"><a href="https://wa.me/${phone}?text=${encodeURIComponent(`Hello ${x.full_name}, thank you for visiting Sky Grace Jesus Ministry. We are blessed that you joined us.`)}" target="_blank" class="btn bg-green-50 text-green-700"><i class="fab fa-whatsapp mr-2"></i>WhatsApp</a><button onclick="markContacted('${x.id}')" class="btn bg-blue-50 text-blue-700">Mark Contacted</button><button onclick="setVisitorStatus('${x.id}','Connected')" class="btn bg-violet-50 text-violet-700">Connected</button><button onclick="setVisitorStatus('${x.id}','Member')" class="btn bg-amber-50 text-amber-700">Member</button><button onclick="editVisitor('${x.id}')" class="btn bg-slate-100 text-slate-700">Edit</button><button onclick="deleteVisitor('${x.id}')" class="btn bg-red-50 text-red-700">Delete</button></div></article>`}).join(""):'<div class="panel text-center text-slate-400 font-bold">No visitors found.</div>'}
async function saveVisitor(e){e.preventDefault();const payload={full_name:el("fullName").value.trim(),phone:el("phone").value.trim(),email:clean(el("email").value)?.toLowerCase()||null,first_visit_date:el("firstVisitDate").value,branch:el("branch").value,visit_type:el("visitType").value,invited_by:clean(el("invitedBy").value),ministry_interest:clean(el("ministryInterest").value),prayer_request:clean(el("prayerRequest").value),assigned_to:clean(el("assignedTo").value),next_follow_up_date:el("nextFollowUpDate").value||null,notes:clean(el("notes").value)},id=el("editingId").value;el("saveBtn").disabled=true;const result=id?await supabaseClient.from("church_visitors").update(payload).eq("id",id):await supabaseClient.from("church_visitors").insert(payload);el("saveBtn").disabled=false;if(result.error)return show(result.error.message,false);show(id?"Visitor updated.":"Visitor registered.",true);resetForm();await loadVisitors()}
function editVisitor(id){const x=visitors.find(v=>v.id===id);if(!x)return;el("editingId").value=x.id;el("fullName").value=x.full_name||"";el("phone").value=x.phone||"";el("email").value=x.email||"";el("firstVisitDate").value=x.first_visit_date||"";el("branch").value=x.branch;el("visitType").value=x.visit_type;el("invitedBy").value=x.invited_by||"";el("ministryInterest").value=x.ministry_interest||"";el("prayerRequest").value=x.prayer_request||"";el("assignedTo").value=x.assigned_to||"";el("nextFollowUpDate").value=x.next_follow_up_date||"";el("notes").value=x.notes||"";el("saveBtn").innerHTML='<i class="fas fa-floppy-disk mr-2"></i>Update Visitor';scrollTo({top:0,behavior:"smooth"})}
async function markContacted(id){const {error}=await supabaseClient.from("church_visitors").update({follow_up_status:"Contacted",last_contacted_at:new Date().toISOString()}).eq("id",id);if(error)return alert(error.message);await loadVisitors()}async function setVisitorStatus(id,status){const {error}=await supabaseClient.from("church_visitors").update({follow_up_status:status}).eq("id",id);if(error)return alert(error.message);await loadVisitors()}async function deleteVisitor(id){if(!confirm("Delete this visitor record permanently?"))return;const {error}=await supabaseClient.from("church_visitors").delete().eq("id",id);if(error)return alert(error.message);await loadVisitors()}
function resetForm(){el("visitorForm").reset();el("editingId").value="";el("firstVisitDate").value=new Date().toISOString().slice(0,10);el("branch").value="Okahandja HQ";el("saveBtn").innerHTML='<i class="fas fa-user-plus mr-2"></i>Save Visitor'}function exportCsv(){const data=[["Visitor Number","Name","Phone","Email","First Visit","Branch","Status","Interest","Assigned To","Next Follow-up"],...visitors.map(x=>[x.visitor_number,x.full_name,x.phone,x.email,x.first_visit_date,x.branch,x.follow_up_status,x.ministry_interest,x.assigned_to,x.next_follow_up_date])],csv=data.map(r=>r.map(v=>'"'+String(v??"").replaceAll('"','""')+'"').join(",")).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="sky-grace-visitors.csv";a.click();URL.revokeObjectURL(a.href)}function show(m,ok){el("formStatus").textContent=m;el("formStatus").className=`rounded-xl p-3 text-sm font-bold ${ok?"bg-green-50 text-green-700":"bg-red-50 text-red-700"}`}function statusClass(s){return ["Connected","Member"].includes(s)?"bg-green-100 text-green-700":s==="New"?"bg-blue-100 text-blue-700":s==="Do Not Contact"?"bg-slate-200 text-slate-600":"bg-amber-100 text-amber-700"}function clean(v){v=String(v||"").trim();return v||null}function esc(v){return String(v||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
</script></body></html>
