<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Prayer Wall | Sky Grace Admin</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
</head>

<body class="bg-slate-50 flex min-h-screen">

  <div id="admin-sidebar-mount"></div>
  <script src="admin-sidebar.js" defer></script>

  <div class="flex-1 flex flex-col min-w-0">
    <header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-8 sticky top-0 z-30">
      <div>
        <h2 class="font-bold text-slate-700 text-lg">Prayer Wall Management</h2>
      </div>

      <a href="prayer-wall.html" class="text-xs font-bold text-slate-400 hover:text-blue-600 transition uppercase tracking-widest">
        View Prayer Wall <i class="fas fa-external-link-alt ml-1"></i>
      </a>
    </header>

    <main class="p-8">
      <div class="flex flex-col md:flex-row items-center justify-between mb-8 gap-4">
        <div>
          <h3 class="text-2xl font-black text-slate-900 uppercase tracking-tight">Prayer Requests</h3>
          <p class="text-slate-500 text-sm">Review, approve, publish, and delete incoming prayer requests.</p>
        </div>

        <div class="relative">
          <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
          <input
            type="text"
            id="requestSearch"
            placeholder="Search requests..."
            class="bg-white border border-slate-200 text-slate-600 pl-10 pr-4 py-3 rounded-xl text-xs font-bold focus:outline-none focus:border-blue-500 transition"
          />
        </div>
      </div>

      <p id="pageStatus" class="mb-4 text-sm font-bold text-slate-500">Loading prayer requests...</p>

      <div class="bg-white rounded-3xl border border-slate-200 shadow-xl overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left">
            <thead class="bg-slate-50 border-b border-slate-100">
              <tr>
                <th class="py-4 px-6 text-[10px] font-black uppercase text-slate-400 tracking-widest">Date</th>
                <th class="py-4 px-6 text-[10px] font-black uppercase text-slate-400 tracking-widest">Name</th>
                <th class="py-4 px-6 text-[10px] font-black uppercase text-slate-400 tracking-widest">Contact</th>
                <th class="py-4 px-6 text-[10px] font-black uppercase text-slate-400 tracking-widest w-1/2">Request</th>
                <th class="py-4 px-6 text-[10px] font-black uppercase text-slate-400 tracking-widest">Status</th>
                <th class="py-4 px-6 text-[10px] font-black uppercase text-slate-400 tracking-widest">Public</th>
                <th class="py-4 px-6 text-right text-[10px] font-black uppercase text-slate-400 tracking-widest">Actions</th>
              </tr>
            </thead>

            <tbody id="requestsTableBody" class="text-sm divide-y divide-slate-50"></tbody>
          </table>
        </div>

        <div class="p-6 border-t border-slate-100 flex justify-between items-center">
          <span id="requestCount" class="text-xs font-bold text-slate-400 uppercase tracking-widest">
            Showing 0 Requests
          </span>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase.js"></script>

  <script>
    let allRequests = [];

    document.addEventListener("DOMContentLoaded", async () => {
      await loadRequests();

      const search = document.getElementById("requestSearch");
      search.addEventListener("input", () => {
        const term = search.value.toLowerCase();

        const filtered = allRequests.filter((r) =>
          String(r.name || "").toLowerCase().includes(term) ||
          String(r.email || "").toLowerCase().includes(term) ||
          String(r.phone || "").toLowerCase().includes(term) ||
          String(r.request || "").toLowerCase().includes(term)
        );

        renderRequests(filtered);
      });
    });

    async function loadRequests() {
      const status = document.getElementById("pageStatus");

      if (!window.supabaseClient) {
        status.textContent = "Supabase is not connected.";
        status.className = "mb-4 text-sm font-bold text-red-600";
        return;
      }

      const { data, error } = await supabaseClient
        .from("prayer_requests")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        status.textContent = error.message;
        status.className = "mb-4 text-sm font-bold text-red-600";
        return;
      }

      allRequests = data || [];
      status.textContent = "";
      renderRequests(allRequests);
    }

    function renderRequests(requests) {
      const tbody = document.getElementById("requestsTableBody");
      const count = document.getElementById("requestCount");

      count.textContent = `Showing ${requests.length} Requests`;

      if (!requests.length) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" class="py-8 px-6 text-center text-slate-400 font-bold">
              No prayer requests found.
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = requests.map((req) => {
        const approved = req.status === "Approved";
        const statusColor = approved
          ? "bg-green-100 text-green-700"
          : "bg-amber-100 text-amber-700";

        return `
          <tr class="hover:bg-blue-50/30 transition">
            <td class="py-5 px-6 text-slate-500 whitespace-nowrap">
              ${req.created_at ? new Date(req.created_at).toLocaleDateString() : ""}
            </td>

            <td class="py-5 px-6 font-bold text-slate-900">
              ${escapeHtml(req.name || "Anonymous")}
            </td>

            <td class="py-5 px-6 text-slate-500 text-xs">
              <div>${escapeHtml(req.email || "")}</div>
              <div>${escapeHtml(req.phone || "")}</div>
            </td>

            <td class="py-5 px-6 text-slate-600 italic">
              "${escapeHtml(req.request || "")}"
            </td>

            <td class="py-5 px-6">
              <span class="px-3 py-1 ${statusColor} text-[10px] font-black rounded-full uppercase tracking-wide">
                ${escapeHtml(req.status || "Pending")}
              </span>
            </td>

            <td class="py-5 px-6">
              <button onclick="togglePublic('${req.id}', ${req.is_public ? "false" : "true"})"
                class="px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-wide ${req.is_public ? "bg-blue-100 text-blue-700" : "bg-slate-100 text-slate-500"}">
                ${req.is_public ? "Public" : "Private"}
              </button>
            </td>

            <td class="py-5 px-6 text-right space-x-2 whitespace-nowrap">
              <button onclick="approveRequest('${req.id}')"
                class="px-3 py-2 rounded-lg bg-green-600 text-white text-xs font-black hover:bg-green-500 transition">
                Approve
              </button>

              <button onclick="setPending('${req.id}')"
                class="px-3 py-2 rounded-lg bg-amber-500 text-white text-xs font-black hover:bg-amber-400 transition">
                Pending
              </button>

              <button onclick="deleteRequest('${req.id}')"
                class="px-3 py-2 rounded-lg bg-red-600 text-white text-xs font-black hover:bg-red-500 transition">
                Delete
              </button>
            </td>
          </tr>
        `;
      }).join("");
    }

    async function approveRequest(id) {
      const { error } = await supabaseClient
        .from("prayer_requests")
        .update({ status: "Approved" })
        .eq("id", id);

      if (error) {
        alert(error.message);
        return;
      }

      await loadRequests();
    }

    async function setPending(id) {
      const { error } = await supabaseClient
        .from("prayer_requests")
        .update({ status: "Pending" })
        .eq("id", id);

      if (error) {
        alert(error.message);
        return;
      }

      await loadRequests();
    }

    async function togglePublic(id, value) {
      const { error } = await supabaseClient
        .from("prayer_requests")
        .update({ is_public: value })
        .eq("id", id);

      if (error) {
        alert(error.message);
        return;
      }

      await loadRequests();
    }

    async function deleteRequest(id) {
      if (!confirm("Delete this prayer request?")) return;

      const { error } = await supabaseClient
        .from("prayer_requests")
        .delete()
        .eq("id", id);

      if (error) {
        alert(error.message);
        return;
      }

      await loadRequests();
    }

    function escapeHtml(str) {
      return String(str || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
