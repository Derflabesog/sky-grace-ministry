﻿<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Management | Sky Grace Admin</title>
  <meta name="robots" content="noindex,nofollow">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 md:flex">
  <div id="admin-sidebar-mount"></div>
  <script src="admin-sidebar.js" defer></script>

  <div class="min-w-0 flex-1">
    <header class="sticky top-0 z-20 flex h-16 items-center justify-between border-b bg-white px-5 md:px-8">
      <h1 class="font-black">Blog Management</h1>
      <div class="flex gap-2">
        <a href="blog-archive.html" target="_blank" class="rounded-xl bg-slate-100 px-4 py-3 text-[10px] font-black uppercase tracking-widest">View Blog</a>
        <a href="create-post.html" class="rounded-xl bg-blue-600 px-4 py-3 text-[10px] font-black uppercase tracking-widest text-white"><i class="fas fa-pen-nib mr-2"></i>Write Article</a>
      </div>
    </header>

    <main class="mx-auto max-w-7xl p-5 md:p-8">
      <div class="mb-7">
        <p class="text-[10px] font-black uppercase tracking-[.22em] text-blue-600">Content</p>
        <h2 class="mt-2 text-3xl font-black">Article Library</h2>
        <p class="mt-2 text-sm text-slate-500">Review published articles and drafts stored in Supabase.</p>
      </div>

      <section class="mb-6 grid gap-4 sm:grid-cols-3">
        <div class="rounded-3xl border bg-white p-6"><p class="text-[10px] font-black uppercase tracking-widest text-slate-400">Total</p><strong id="totalCount" class="mt-2 block text-3xl">0</strong></div>
        <div class="rounded-3xl border bg-white p-6"><p class="text-[10px] font-black uppercase tracking-widest text-slate-400">Published</p><strong id="publishedCount" class="mt-2 block text-3xl text-green-600">0</strong></div>
        <div class="rounded-3xl border bg-white p-6"><p class="text-[10px] font-black uppercase tracking-widest text-slate-400">Drafts</p><strong id="draftCount" class="mt-2 block text-3xl text-amber-600">0</strong></div>
      </section>

      <div class="mb-5 grid gap-3 md:grid-cols-[1fr_190px]">
        <input id="searchBox" class="rounded-2xl border bg-white px-5 py-3 outline-none focus:border-blue-500" placeholder="Search title, author or category">
        <select id="statusFilter" class="rounded-2xl border bg-white px-5 py-3">
          <option value="all">All statuses</option>
          <option>Published</option>
          <option>Draft</option>
        </select>
      </div>

      <p id="pageStatus" class="mb-4 text-sm font-bold text-slate-500">Loading articles...</p>
      <div id="articleList" class="space-y-4"></div>
    </main>
  </div>

  <script>
    let posts = [];
    const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[c]);

    async function waitForSupabase() {
      for (let i = 0; i < 80; i += 1) {
        if (window.supabaseClient) return window.supabaseClient;
        await new Promise((resolve) => setTimeout(resolve, 100));
      }
      throw new Error("Database connection is unavailable.");
    }

    function render() {
      const query = document.getElementById("searchBox").value.toLowerCase();
      const status = document.getElementById("statusFilter").value;
      const filtered = posts.filter((post) =>
        (status === "all" || post.status === status) &&
        [post.title, post.author_name, post.category].join(" ").toLowerCase().includes(query)
      );

      document.getElementById("totalCount").textContent = posts.length;
      document.getElementById("publishedCount").textContent = posts.filter((p) => p.status === "Published").length;
      document.getElementById("draftCount").textContent = posts.filter((p) => p.status === "Draft").length;
      document.getElementById("pageStatus").textContent =
        `${filtered.length} article${filtered.length === 1 ? "" : "s"} shown`;

      document.getElementById("articleList").innerHTML = filtered.length
        ? filtered.map((post) => `
          <article class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
            <div class="flex flex-col justify-between gap-5 md:flex-row">
              <div>
                <div class="flex flex-wrap items-center gap-2">
                  <span class="rounded-full px-3 py-1 text-[10px] font-black uppercase ${post.status === "Published" ? "bg-green-100 text-green-700" : "bg-amber-100 text-amber-700"}">${esc(post.status)}</span>
                  <span class="text-[10px] font-black uppercase tracking-widest text-blue-600">${esc(post.category)}</span>
                </div>
                <h3 class="mt-3 text-xl font-black">${esc(post.title)}</h3>
                <p class="mt-2 text-sm text-slate-500">${esc(post.summary)}</p>
                <p class="mt-3 text-xs font-bold text-slate-400">${esc(post.author_name)} · ${new Date(post.created_at).toLocaleDateString("en-NA")}</p>
              </div>
              <div class="flex shrink-0 flex-wrap gap-2">
                <button onclick="toggleStatus('${post.id}','${post.status}')" class="h-fit rounded-xl bg-blue-50 px-4 py-3 text-[10px] font-black uppercase text-blue-700">${post.status === "Published" ? "Move to Draft" : "Publish"}</button>
                <button onclick="deletePost('${post.id}')" class="h-fit rounded-xl bg-red-50 px-4 py-3 text-[10px] font-black uppercase text-red-700">Delete</button>
              </div>
            </div>
          </article>`).join("")
        : '<div class="rounded-3xl border bg-white p-10 text-center font-bold text-slate-400">No articles found.</div>';
    }

    async function loadPosts() {
      try {
        const client = await waitForSupabase();
        const { data, error } = await client.from("blog_posts").select("*").order("created_at", { ascending: false });
        if (error) throw error;
        posts = data || [];
        render();
      } catch (error) {
        document.getElementById("pageStatus").textContent = error.message || "Could not load articles.";
        document.getElementById("pageStatus").className = "mb-4 text-sm font-bold text-red-600";
      }
    }

    async function toggleStatus(id, current) {
      const next = current === "Published" ? "Draft" : "Published";
      const client = await waitForSupabase();
      const values = { status: next, published_at: next === "Published" ? new Date().toISOString() : null };
      const { error } = await client.from("blog_posts").update(values).eq("id", id);
      if (error) return alert(error.message);
      await loadPosts();
    }

    async function deletePost(id) {
      if (!confirm("Delete this article permanently?")) return;
      const client = await waitForSupabase();
      const { error } = await client.from("blog_posts").delete().eq("id", id);
      if (error) return alert(error.message);
      await loadPosts();
    }

    document.getElementById("searchBox").addEventListener("input", render);
    document.getElementById("statusFilter").addEventListener("change", render);
    loadPosts();
  </script>
</body>
</html>
