<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Manage Students | Sky Grace Admin</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
</head>

<body class="bg-slate-50 flex min-h-screen">

  <div id="admin-sidebar-mount"></div>
  <script src="admin-sidebar.js" defer></script>

  <div class="flex-1 flex flex-col min-w-0">
    <header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-8 sticky top-0 z-30">
      <h2 class="font-bold text-slate-700 text-lg">Theology School</h2>

      <a href="theology-register.html" class="text-xs font-bold text-slate-400 hover:text-blue-600 transition uppercase tracking-widest">
        View Registration Page <i class="fas fa-external-link-alt ml-1"></i>
      </a>
    </header>

    <main class="p-8">
      <div class="flex flex-col md:flex-row items-center justify-between mb-8 gap-4">
        <div>
          <h3 class="text-2xl font-black text-slate-900 uppercase tracking-tight">Student Applications</h3>
          <p class="text-slate-500 text-sm">View and manage School of Theology student registrations.</p>
        </div>

        <div class="relative">
          <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
          <input
            type="text"
            id="studentSearch"
            placeholder="Search students..."
            class="bg-white border border-slate-200 text-slate-600 pl-10 pr-4 py-3 rounded-xl text-xs font-bold focus:outline-none focus:border-blue-500 transition"
          />
        </div>
      </div>

      <p id="pageStatus" class="mb-4 text-sm font-bold text-slate-500">Loading students...</p>

      <div class="bg-white rounded-3xl border border-slate-200 shadow-xl overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left">
            <thead class="bg-slate-50 border-b border-slate-100">
              <tr>
                <th class="py-4 px-6 text-[10px] font-black uppercase text-slate-400 tracking-widest">Name</th>
                <th class="py-4 px-6 text-[10px] font-black uppercase text-slate-400 tracking-widest">Contact</th>
                <th class="py-4 px-6 text-[10px] font-black uppercase text-slate-400 tracking-widest">Course</th>
                <th class="py-4 px-6 text-[10px] font-black uppercase text-slate-400 tracking-widest">Message</th>
                <th class="py-4 px-6 text-[10px] font-black uppercase text-slate-400 tracking-widest">Date</th>
                <th class="py-4 px-6 text-right text-[10px] font-black uppercase text-slate-400 tracking-widest">Actions</th>
              </tr>
            </thead>

            <tbody id="studentsTableBody" class="text-sm divide-y divide-slate-50"></tbody>
          </table>
        </div>

        <div class="p-6 border-t border-slate-100">
          <span id="studentCount" class="text-xs font-bold text-slate-400 uppercase tracking-widest">
            Showing 0 Students
          </span>
        </div>
      </div>
    </main>
  </div>

  <!-- View Modal -->
  <div id="viewModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/50 backdrop-blur-sm">
    <div class="bg-white rounded-3xl shadow-2xl p-8 max-w-2xl w-full mx-4 relative">
      <button onclick="closeViewModal()" class="absolute top-6 right-6 text-slate-400 hover:text-slate-600">
        <i class="fas fa-times text-xl"></i>
      </button>

      <div class="flex items-center gap-5 mb-8 border-b border-slate-100 pb-6">
        <div id="viewInitials" class="w-20 h-20 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-2xl font-black">
          SG
        </div>

        <div>
          <h3 id="viewName" class="text-2xl font-black text-slate-900 uppercase tracking-tight">Student Name</h3>
          <p id="viewCourse" class="text-slate-500 text-sm font-bold">Course</p>
        </div>
      </div>

      <div class="grid md:grid-cols-2 gap-6 text-sm">
        <div>
          <p class="text-slate-400 text-xs font-black uppercase tracking-widest">Email</p>
          <p id="viewEmail" class="font-bold text-slate-700 mt-1"></p>
        </div>

        <div>
          <p class="text-slate-400 text-xs font-black uppercase tracking-widest">Phone</p>
          <p id="viewPhone" class="font-bold text-slate-700 mt-1"></p>
        </div>

        <div>
          <p class="text-slate-400 text-xs font-black uppercase tracking-widest">Registration Date</p>
          <p id="viewDate" class="font-bold text-slate-700 mt-1"></p>
        </div>

        <div>
          <p class="text-slate-400 text-xs font-black uppercase tracking-widest">Student ID</p>
          <p id="viewId" class="font-bold text-slate-700 mt-1"></p>
        </div>
      </div>

      <div class="mt-6">
        <p class="text-slate-400 text-xs font-black uppercase tracking-widest mb-2">Message</p>
        <div id="viewMessage" class="bg-slate-50 rounded-2xl p-5 text-slate-700 leading-relaxed"></div>
      </div>

      <div class="mt-6 flex flex-wrap gap-3">
        <a id="viewReply" href="#" class="px-5 py-3 bg-blue-600 text-white rounded-xl text-xs font-black uppercase tracking-widest hover:bg-blue-500">
          Reply by Email
        </a>

        <button id="viewDeleteBtn" class="px-5 py-3 bg-red-600 text-white rounded-xl text-xs font-black uppercase tracking-widest hover:bg-red-500">
          Delete Student
        </button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase.js"></script>

  <script>
    let allStudents = [];
    let selectedStudentId = null;

    document.addEventListener("DOMContentLoaded", async () => {
      await loadStudents();

      const search = document.getElementById("studentSearch");
      search.addEventListener("input", () => {
        const term = search.value.toLowerCase();

        const filtered = allStudents.filter((student) =>
          String(student.full_name || "").toLowerCase().includes(term) ||
          String(student.email || "").toLowerCase().includes(term) ||
          String(student.phone || "").toLowerCase().includes(term) ||
          String(student.course || "").toLowerCase().includes(term) ||
          String(student.message || "").toLowerCase().includes(term)
        );

        renderStudents(filtered);
      });
    });

    async function loadStudents() {
      const status = document.getElementById("pageStatus");

      if (!window.supabaseClient) {
        status.textContent = "Supabase is not connected.";
        status.className = "mb-4 text-sm font-bold text-red-600";
        return;
      }

      const { data, error } = await supabaseClient
        .from("theology_students")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        status.textContent = error.message;
        status.className = "mb-4 text-sm font-bold text-red-600";
        return;
      }

      allStudents = data || [];
      status.textContent = "";
      renderStudents(allStudents);
    }

    function renderStudents(students) {
      const tbody = document.getElementById("studentsTableBody");
      const count = document.getElementById("studentCount");

      count.textContent = `Showing ${students.length} Students`;

      if (!students.length) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="py-8 px-6 text-center text-slate-400 font-bold">
              No student applications found.
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = students.map((student) => `
        <tr class="hover:bg-blue-50/30 transition">
          <td class="py-5 px-6">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 font-black text-xs">
                ${getInitials(student.full_name)}
              </div>

              <div>
                <span class="font-bold text-slate-900 block">${escapeHtml(student.full_name || "No Name")}</span>
                <span class="text-xs text-slate-400">${escapeHtml(shortId(student.id))}</span>
              </div>
            </div>
          </td>

          <td class="py-5 px-6 text-slate-500 text-xs">
            <div>${escapeHtml(student.email || "")}</div>
            <div>${escapeHtml(student.phone || "")}</div>
          </td>

          <td class="py-5 px-6 text-slate-700 font-bold">
            ${escapeHtml(student.course || "No course")}
          </td>

          <td class="py-5 px-6 text-slate-500 max-w-xs truncate">
            ${escapeHtml(student.message || "")}
          </td>

          <td class="py-5 px-6 text-slate-500 whitespace-nowrap">
            ${student.created_at ? new Date(student.created_at).toLocaleDateString() : ""}
          </td>

          <td class="py-5 px-6 text-right space-x-2 whitespace-nowrap">
            <button onclick="viewStudent('${student.id}')"
              class="px-3 py-2 rounded-lg bg-blue-600 text-white text-xs font-black hover:bg-blue-500 transition">
              View
            </button>

            <button onclick="deleteStudent('${student.id}')"
              class="px-3 py-2 rounded-lg bg-red-600 text-white text-xs font-black hover:bg-red-500 transition">
              Delete
            </button>
          </td>
        </tr>
      `).join("");
    }

    function viewStudent(id) {
      const student = allStudents.find((s) => s.id === id);
      if (!student) return;

      selectedStudentId = id;

      document.getElementById("viewInitials").textContent = getInitials(student.full_name);
      document.getElementById("viewName").textContent = student.full_name || "No Name";
      document.getElementById("viewCourse").textContent = student.course || "No course";
      document.getElementById("viewEmail").textContent = student.email || "No email";
      document.getElementById("viewPhone").textContent = student.phone || "No phone";
      document.getElementById("viewDate").textContent = student.created_at ? new Date(student.created_at).toLocaleString() : "";
      document.getElementById("viewId").textContent = student.id || "";
      document.getElementById("viewMessage").textContent = student.message || "No message";

      document.getElementById("viewReply").href = student.email
        ? `mailto:${student.email}?subject=Sky Grace School of Theology Application`
        : "#";

      document.getElementById("viewDeleteBtn").onclick = () => deleteStudent(student.id);

      const modal = document.getElementById("viewModal");
      modal.classList.remove("hidden");
      modal.classList.add("flex");
    }

    function closeViewModal() {
      const modal = document.getElementById("viewModal");
      modal.classList.add("hidden");
      modal.classList.remove("flex");
      selectedStudentId = null;
    }

    async function deleteStudent(id) {
      if (!confirm("Delete this student application?")) return;

      const { error } = await supabaseClient
        .from("theology_students")
        .delete()
        .eq("id", id);

      if (error) {
        alert(error.message);
        return;
      }

      closeViewModal();
      await loadStudents();
    }

    function getInitials(name) {
      return String(name || "SG")
        .split(" ")
        .map((part) => part[0])
        .join("")
        .substring(0, 2)
        .toUpperCase();
    }

    function shortId(id) {
      return id ? `ID: ${String(id).substring(0, 8)}` : "";
    }

    function escapeHtml(str) {
      return String(str || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>

</body>
</html>
