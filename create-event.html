<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Event | Sky Grace Admin</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
</head>

<body class="bg-slate-50 flex min-h-screen">

  <div id="admin-sidebar-mount"></div>
  <script src="admin-sidebar.js" defer></script>

  <div class="flex-1 flex flex-col min-w-0">
    <header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-8 sticky top-0 z-30">
      <h2 class="font-bold text-slate-700 text-lg">Create New Event</h2>

      <a href="manage-events.html" class="text-xs font-bold text-slate-400 hover:text-blue-600 transition uppercase tracking-widest">
        <i class="fas fa-arrow-left mr-1"></i> Back to Events
      </a>
    </header>

    <main class="p-8 max-w-5xl mx-auto w-full">
      <form id="createEventForm" class="bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden">

        <div class="p-10 space-y-8">
          <input
            type="text"
            id="eventTitle"
            placeholder="Event Name..."
            required
            class="w-full text-4xl font-black text-slate-900 placeholder-slate-300 focus:outline-none border-none leading-tight bg-transparent"
          />

          <div class="grid md:grid-cols-2 gap-6 border-y border-slate-50 py-6">
            <div class="space-y-4">
              <div>
                <label class="block text-[10px] font-black uppercase text-slate-400 mb-2">Date & Time</label>
                <div class="flex gap-2">
                  <input id="eventDate" type="date" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-400" />
                  <input id="eventTime" type="time" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-400" />
                </div>
              </div>

              <div>
                <label class="block text-[10px] font-black uppercase text-slate-400 mb-2">Venue</label>
                <input id="eventVenue" type="text" required placeholder="e.g. Windhoek Main Hall" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-400" />
              </div>

              <div>
                <label class="block text-[10px] font-black uppercase text-slate-400 mb-2">Speaker</label>
                <input id="eventSpeaker" type="text" placeholder="e.g. Apostle Polly" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-400" />
              </div>
            </div>

            <div class="space-y-4">
              <div>
                <label class="block text-[10px] font-black uppercase text-slate-400 mb-2">Event Type</label>
                <select id="eventType" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-400">
                  <option>Conference</option>
                  <option>Seminar</option>
                  <option>Service</option>
                  <option>Outreach</option>
                </select>
              </div>

              <div>
                <label class="block text-[10px] font-black uppercase text-slate-400 mb-2">Banner URL</label>
                <input id="eventBannerUrl" type="url" placeholder="https://..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-400" />
              </div>

              <label class="flex items-center gap-3 bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-bold text-slate-600">
                <input id="eventPublished" type="checkbox" checked />
                Publish immediately
              </label>
            </div>
          </div>

          <div>
            <label class="block text-[10px] font-black uppercase text-slate-400 mb-2">Event Description</label>
            <textarea id="eventDescription" rows="6" required placeholder="Describe the event details..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-600 leading-relaxed focus:outline-none focus:border-blue-400 resize-none"></textarea>
          </div>

          <p id="eventStatus" class="text-sm font-bold min-h-[1.25rem]"></p>
        </div>

        <div class="bg-slate-50 p-6 border-t border-slate-100 flex justify-between items-center">
          <p class="text-xs text-slate-400 font-bold italic">Saved to Supabase</p>

          <button id="submitEventBtn" type="submit" class="bg-blue-600 text-white px-8 py-3 rounded-xl text-xs font-black uppercase tracking-widest hover:bg-blue-700 transition shadow-lg shadow-blue-200">
            Save Event
          </button>
        </div>
      </form>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase.js"></script>

  <script>
    document.getElementById("createEventForm").addEventListener("submit", createEvent);

    async function createEvent(e) {
      e.preventDefault();

      const title = document.getElementById("eventTitle").value.trim();
      const event_date = document.getElementById("eventDate").value;
      const event_time = document.getElementById("eventTime").value;
      const venue = document.getElementById("eventVenue").value.trim();
      const speaker = document.getElementById("eventSpeaker").value.trim();
      const banner_url = document.getElementById("eventBannerUrl").value.trim();
      const description = document.getElementById("eventDescription").value.trim();
      const is_published = document.getElementById("eventPublished").checked;

      const status = document.getElementById("eventStatus");
      const btn = document.getElementById("submitEventBtn");

      if (!window.supabaseClient) {
        status.textContent = "Supabase is not connected.";
        status.className = "text-sm font-bold text-red-600";
        return;
      }

      status.textContent = "Saving event...";
      status.className = "text-sm font-bold text-blue-600";
      btn.disabled = true;
      btn.classList.add("opacity-70");

      const { error } = await supabaseClient
        .from("ministry_events")
        .insert([
          {
            title,
            event_date,
            event_time,
            venue,
            speaker,
            banner_url,
            description,
            is_published
          }
        ]);

      btn.disabled = false;
      btn.classList.remove("opacity-70");

      if (error) {
        console.error("Event insert error:", error);
        status.textContent = error.message;
        status.className = "text-sm font-bold text-red-600";
        return;
      }

      alert("Event saved successfully!");
      window.location.href = "manage-events.html?v=4";
    }
  </script>
</body>
</html>
