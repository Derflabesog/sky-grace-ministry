<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sermon Archive | Sky Grace Jesus Ministry</title>
  <meta name="description" content="Watch sermons and download learning aids from Sky Grace Jesus Ministry." />

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />

  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
</head>

<body class="bg-[#f1f5f9] text-slate-900 font-sans antialiased dark:bg-slate-950 dark:text-white">
  <div id="site-header"></div>
  <script src="./header.js" defer></script>

  <!-- HERO (same image as index.html) -->
  <section class="relative overflow-hidden bg-black min-h-[55vh] flex items-center">
    <div class="absolute inset-0">
      <img
        src="assets/images/hero-elohim.jpg"
        alt="Sky Grace Jesus Ministry"
        class="w-full h-full object-cover object-center md:object-[50%_35%]"
      />
    </div>
    <div class="absolute inset-0 bg-gradient-to-b from-black/85 via-black/55 to-black/90"></div>
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_60%_40%,rgba(245,158,11,0.22),transparent_55%)]"></div>

    <div class="relative z-10 container mx-auto px-6 py-16">
      <p class="inline-flex items-center gap-2 text-[11px] font-black uppercase tracking-[0.25em] text-amber-300 mb-4">
        <span class="w-2 h-2 rounded-full bg-amber-300 shadow-[0_0_16px_rgba(245,158,11,0.8)]"></span>
        Media Library
      </p>
      <h1 class="text-3xl md:text-5xl font-black text-white leading-tight">Sermon Archive</h1>
      <p class="mt-4 text-slate-200 max-w-2xl leading-relaxed">
        Watch the message, then download the PDF learning aid (summary, key scriptures, and learning points).
      </p>

      <div class="mt-7 flex flex-col sm:flex-row gap-3">
        <a href="https://www.youtube.com/@skygraceministryTV" target="_blank"
           class="inline-flex items-center justify-center gap-2 px-6 py-3 rounded-2xl bg-red-600 text-white font-black uppercase text-[11px] tracking-widest hover:bg-red-500 transition">
          <i class="fa-brands fa-youtube"></i> Visit YouTube Channel
        </a>
        <a href="index.html"
           class="inline-flex items-center justify-center gap-2 px-6 py-3 rounded-2xl bg-white/10 text-white font-black uppercase text-[11px] tracking-widest border border-white/15 hover:bg-white/15 transition backdrop-blur">
          <i class="fa-solid fa-house"></i> Back Home
        </a>
      </div>
    </div>
  </section>

  <!-- FILTER + SEARCH -->
  <section class="py-10 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800">
    <div class="container mx-auto px-6">
      <div class="grid lg:grid-cols-2 gap-6 items-center">
        <div class="flex flex-wrap gap-2" id="filterBar">
          <button data-filter="all"
            class="filter-btn px-5 py-2.5 rounded-full bg-slate-900 text-white font-black text-[11px] uppercase tracking-widest hover:bg-slate-800 transition">
            All
          </button>
          <button data-filter="sunday"
            class="filter-btn px-5 py-2.5 rounded-full bg-slate-100 text-slate-600 font-black text-[11px] uppercase tracking-widest hover:bg-slate-200 hover:text-slate-900 transition">
            Sunday
          </button>
          <button data-filter="prophetic"
            class="filter-btn px-5 py-2.5 rounded-full bg-slate-100 text-slate-600 font-black text-[11px] uppercase tracking-widest hover:bg-slate-200 hover:text-slate-900 transition">
            Prophetic
          </button>
          <button data-filter="teaching"
            class="filter-btn px-5 py-2.5 rounded-full bg-slate-100 text-slate-600 font-black text-[11px] uppercase tracking-widest hover:bg-slate-200 hover:text-slate-900 transition">
            Teaching
          </button>
        </div>

        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-5 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input id="sermonSearch" type="text"
            placeholder="Search sermons (title, speaker, scripture...)"
            class="w-full bg-slate-50 dark:bg-slate-950/40 border border-slate-200 dark:border-slate-800 py-4 pl-14 pr-6 rounded-2xl outline-none focus:ring-2 ring-amber-500 transition shadow-sm" />
        </div>
      </div>
    </div>
  </section>

  <!-- GRID -->
  <section class="py-14">
    <div class="container mx-auto px-6">
      <div class="flex items-end justify-between gap-4 mb-8">
        <div>
          <p class="text-[11px] font-black uppercase tracking-[0.25em] text-slate-400">Browse</p>
          <h2 class="text-2xl md:text-3xl font-black uppercase">All Messages</h2>
        </div>
      </div>

      <div id="sermonGrid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>

      <div id="emptyState" class="hidden mt-10">
        <div class="max-w-xl mx-auto bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-[2rem] p-10 shadow-sm text-center">
          <div class="w-14 h-14 rounded-2xl bg-slate-100 dark:bg-slate-950/40 border border-slate-200 dark:border-slate-800 mx-auto flex items-center justify-center text-slate-600 dark:text-slate-300 mb-4">
            <i class="fa-solid fa-magnifying-glass"></i>
          </div>
          <h3 class="text-xl font-black">No sermons found</h3>
          <p class="text-slate-600 dark:text-slate-300 mt-2">Try another search term or change the filter.</p>
        </div>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>
  <script src="./footer.js" defer></script>

  <!-- Data + Archive renderer -->
  <script src="assets/js/sermons-data.js"></script>
  <script src="assets/js/sermons-archive.js"></script>
</body>
</html>
