<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event Registrations | Sky Grace Admin</title><script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"></head>
<body class="bg-slate-50 flex min-h-screen"><div id="admin-sidebar-mount"></div><script src="admin-sidebar.js" defer></script>
<div class="flex-1 min-w-0"><header class="h-16 bg-white border-b px-8 flex items-center justify-between sticky top-0 z-20"><h1 class="font-black text-slate-800">Event Registrations</h1><button onclick="exportCsv()" class="bg-green-600 text-white px-5 py-3 rounded-xl text-xs font-black uppercase"><i class="fas fa-file-csv mr-2"></i>Export CSV</button></header>
<main class="p-8"><section class="grid md:grid-cols-4 gap-4 mb-7"><div class="card"><small>Total People</small><strong id="totalPeople">0</strong></div><div class="card"><small>Registrations</small><strong id="totalRegistrations">0</strong></div><div class="card"><small>Confirmed</small><strong id="confirmedCount">0</strong></div><div class="card"><small>Attended</small><strong id="attendedCount">0</strong></div></section>
<div class="flex flex-col md:flex-row gap-3 mb-5"><input id="search" class="control flex-1" placeholder="Search name, phone, email or event..."><select id="eventFilter" class="control"><option value="all">All events</option></select><select id="statusFilter" class="control"><option value="all">All statuses</option><option>Registered</option><option>Confirmed</option><option>Cancelled</option><option>Attended</option></select></div>
<p id="notice" class="text-sm font-bold text-slate-500 mb-4">Loading registrations...</p><div class="bg-white rounded-3xl border shadow-sm overflow-x-auto"><table class="w-full text-left"><thead class="bg-slate-50 text-[10px] uppercase tracking-widest text-slate-400"><tr><th class="p-5">Attendee</th><th class="p-5">Event</th><th class="p-5">People</th><th class="p-5">Status</th><th class="p-5">Registered</th><th class="p-5 text-right">Actions</th></tr></thead><tbody id="rows" class="divide-y"></tbody></table><p id="count" class="p-5 border-t text-xs font-bold uppercase text-slate-400">Showing 0</p></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase.js"></script><script src="assets/js/guard.js"></script>
<style>.card{background:white;border:1px solid #e2e8f0;border-radius:1rem;padding:1.25rem}.card small{display:block;font-size:.625rem;font-weight:900;text-transform:uppercase;letter-spacing:.12em;color:#94a3b8}.card strong{display:block;font-size:1.875rem;margin-top:.4rem}.control{background:white;border:1px solid #e2e8f0;border-radius:.75rem;padding:.75rem 1rem;font-size:.8rem;font-weight:700;outline:none}</style>
<script>
let all=[];document.addEventListener("DOMContentLoaded",()=>{load();search.oninput=filter;eventFilter.onchange=filter;statusFilter.onchange=filter});
async function load(){const {data,error}=await supabaseClient.from("event_registrations").select("*,event:ministry_events(id,title,event_date)").order("created_at",{ascending:false});if(error){notice.textContent=error.message;notice.className="text-red-600 mb-4 font-bold";return}all=data||[];notice.textContent="";buildEventFilter();stats();filter()}
function buildEventFilter(){const items=[...new Map(all.filter(x=>x.event).map(x=>[x.event.id,x.event])).values()];eventFilter.innerHTML='<option value="all">All events</option>'+items.map(e=>`<option value="${e.id}">${esc(e.title)}</option>`).join("")}
function filter(){const q=search.value.toLowerCase(),ev=eventFilter.value,st=statusFilter.value;render(all.filter(x=>(ev==="all"||x.event_id===ev)&&(st==="all"||x.status===st)&&[x.full_name,x.phone,x.email,x.event?.title].join(" ").toLowerCase().includes(q)))}
function render(items){count.textContent=`Showing ${items.length} registration(s)`;rows.innerHTML=items.length?items.map(x=>`<tr><td class="p-5"><b>${esc(x.full_name)}</b><p class="text-xs text-slate-400">${esc(x.phone)}${x.email?" · "+esc(x.email):""}</p></td><td class="p-5"><b>${esc(x.event?.title||"Deleted event")}</b><p class="text-xs text-slate-400">${esc(x.event?.event_date||"")}</p></td><td class="p-5 font-black">${1+Number(x.guest_count||0)}</td><td class="p-5"><select onchange="changeStatus('${x.id}',this.value)" class="control">${["Registered","Confirmed","Cancelled","Attended"].map(s=>`<option ${x.status===s?"selected":""}>${s}</option>`).join("")}</select></td><td class="p-5 text-xs text-slate-500">${new Date(x.created_at).toLocaleString()}</td><td class="p-5 text-right"><button onclick="removeRow('${x.id}')" class="bg-red-50 text-red-600 rounded-xl px-3 py-2"><i class="fas fa-trash"></i></button></td></tr>`).join(""):'<tr><td colspan="6" class="p-12 text-center text-slate-400 font-bold">No registrations found.</td></tr>'}
function stats(){totalRegistrations.textContent=all.length;totalPeople.textContent=all.reduce((n,x)=>n+1+Number(x.guest_count||0),0);confirmedCount.textContent=all.filter(x=>x.status==="Confirmed").length;attendedCount.textContent=all.filter(x=>x.status==="Attended").length}
async function changeStatus(id,status){const {error}=await supabaseClient.from("event_registrations").update({status}).eq("id",id);if(error)return alert(error.message);await load()}
async function removeRow(id){if(!confirm("Delete this registration?"))return;const {error}=await supabaseClient.from("event_registrations").delete().eq("id",id);if(error)return alert(error.message);await load()}
function exportCsv(){const values=[["Event","Full Name","Phone","Email","Branch","Guests","Status","Registered"],...all.map(x=>[x.event?.title,x.full_name,x.phone,x.email,x.branch,x.guest_count,x.status,x.created_at])];const csv=values.map(r=>r.map(v=>'"'+String(v??"").replaceAll('"','""')+'"').join(",")).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="sky-grace-event-registrations.csv";a.click();URL.revokeObjectURL(a.href)}
function esc(v){return String(v||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
</script></body></html>
