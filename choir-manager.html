<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choir Management | Sky Grace Admin</title><script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"></head><body class="bg-slate-50 flex min-h-screen"><div id="admin-sidebar-mount"></div><script src="admin-sidebar.js" defer></script><div class="flex-1 min-w-0"><header class="h-16 bg-white border-b px-8 flex items-center justify-between sticky top-0 z-30"><div><h1 class="font-black">Choir Management</h1><p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Members, voice sections and rehearsal attendance</p></div><button onclick="exportChoir()" class="btn bg-green-600 text-white"><i class="fas fa-file-csv mr-2"></i>Export CSV</button></header>
<main class="p-6 lg:p-8 max-w-[1600px] mx-auto"><section class="grid xl:grid-cols-[390px_1fr] gap-7 items-start"><form id="choirForm" class="panel space-y-5 xl:sticky xl:top-24"><input id="editingId" type="hidden"><div><h2 class="text-xl font-black">Register Choir Member</h2><p class="sub">Assign voice section, ministry role and availability.</p></div><div><label class="label">Full Name *</label><input id="fullName" required class="field"></div><div class="grid grid-cols-2 gap-4"><div><label class="label">Phone *</label><input id="phone" required class="field" placeholder="+264..."></div><div><label class="label">Email</label><input id="email" type="email" class="field"></div></div><div class="grid grid-cols-2 gap-4"><div><label class="label">Voice / Section *</label><select id="voicePart" class="field"><option>Not Assigned</option><option>Soprano</option><option>Alto</option><option>Tenor</option><option>Bass</option><option>Instrumentalist</option></select></div><div><label class="label">Choir Role</label><select id="choirRole" class="field"><option>Member</option><option>Choir Director</option><option>Assistant Director</option><option>Worship Leader</option><option>Section Leader</option><option>Secretary</option><option>Instrumentalist</option></select></div></div><div><label class="label">Instrument</label><input id="instrument" class="field" placeholder="Keyboard, drums, guitar..."></div><div><label class="label">Branch *</label><select id="branch" class="field"><option>Okahandja HQ</option><option>Windhoek</option><option>Online</option><option>Other</option></select></div><div><label class="label">Joined Date</label><input id="joinedDate" type="date" class="field"></div><div><label class="label">Availability</label><input id="availability" class="field" placeholder="e.g. Wednesday evenings and Sundays"></div><div class="grid grid-cols-2 gap-4"><div><label class="label">Emergency Contact</label><input id="emergencyContact" class="field"></div><div><label class="label">Emergency Phone</label><input id="emergencyPhone" class="field"></div></div><div><label class="label">Notes</label><textarea id="notes" rows="3" class="field"></textarea></div><p id="formStatus" class="hidden rounded-xl p-3 text-sm font-bold"></p><div class="flex gap-3"><button id="saveBtn" class="btn bg-fuchsia-600 text-white flex-1"><i class="fas fa-music mr-2"></i>Save Member</button><button type="button" onclick="resetForm()" class="btn bg-slate-100 text-slate-600">Clear</button></div></form>
<div><section class="grid sm:grid-cols-4 gap-4 mb-5"><div class="stat"><small>Total Members</small><strong id="totalMembers">0</strong></div><div class="stat"><small>Active</small><strong id="activeMembers" class="text-green-600">0</strong></div><div class="stat"><small>Leaders</small><strong id="totalLeaders" class="text-fuchsia-600">0</strong></div><div class="stat"><small>Present Today</small><strong id="presentToday" class="text-blue-600">0</strong></div></section><div class="grid md:grid-cols-[1fr_190px_170px] gap-3 mb-4"><input id="searchBox" class="field" placeholder="Search member, phone, role, instrument..."><select id="voiceFilter" class="field"><option value="all">All voice sections</option><option>Soprano</option><option>Alto</option><option>Tenor</option><option>Bass</option><option>Instrumentalist</option><option>Not Assigned</option></select><select id="statusFilter" class="field"><option value="all">All statuses</option><option>Active</option><option>Inactive</option><option>On Leave</option></select></div><p id="pageStatus" class="mb-4 text-sm font-bold text-slate-500">Loading choir members...</p><div id="choirList" class="grid lg:grid-cols-2 gap-4"></div></div></section></main></div>
<div id="attendanceModal" class="fixed inset-0 bg-slate-950/60 hidden items-center justify-center z-50 p-5"><form id="attendanceForm" class="bg-white rounded-3xl w-full max-w-lg p-7"><h2 class="text-2xl font-black">Record Attendance</h2><p id="attendanceMember" class="sub mt-1"></p><input id="attendanceMemberId" type="hidden"><div class="grid grid-cols-2 gap-4 mt-5"><div><label class="label">Date *</label><input id="attendanceDate" required type="date" class="field"></div><div><label class="label">Status *</label><select id="attendanceStatus" class="field"><option>Present</option><option>Late</option><option>Excused</option><option>Absent</option></select></div></div><div class="mt-4"><label class="label">Session *</label><select id="sessionType" class="field"><option>Rehearsal</option><option>Sunday Service</option><option>Special Service</option><option>Conference</option><option>Outreach</option><option>Recording</option></select></div><div class="mt-4"><label class="label">Notes</label><textarea id="attendanceNotes" rows="2" class="field"></textarea></div><div class="flex gap-3 mt-6"><button class="btn bg-fuchsia-600 text-white flex-1">Save Attendance</button><button type="button" onclick="closeAttendance()" class="btn bg-slate-100">Cancel</button></div></form></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase.js"></script><script src="assets/js/guard.js"></script><style>.panel,.stat,.member-card{background:#fff;border:1px solid #e2e8f0;border-radius:1rem;padding:1.25rem}.label,.stat small{display:block;margin-bottom:.4rem;font-size:.61rem;font-weight:900;text-transform:uppercase;letter-spacing:.1em;color:#94a3b8}.field{width:100%;background:#f8fafc;border:1px solid #e2e8f0;border-radius:.75rem;padding:.78rem .95rem;font-size:.78rem;font-weight:700}.btn{border-radius:.75rem;padding:.78rem 1rem;font-size:.67rem;font-weight:900;text-transform:uppercase;letter-spacing:.06em}.sub{font-size:.75rem;color:#64748b}.stat strong{display:block;font-size:1.5rem;margin-top:.4rem}.badge{padding:.35rem .65rem;border-radius:99px;font-size:.56rem;font-weight:900;text-transform:uppercase}</style>
<script>
let members=[],attendance=[];const el=id=>document.getElementById(id);document.addEventListener("DOMContentLoaded",()=>{el("choirForm").onsubmit=saveMember;el("attendanceForm").onsubmit=saveAttendance;el("searchBox").oninput=render;el("voiceFilter").onchange=render;el("statusFilter").onchange=render;resetForm();loadAll()});async function loadAll(){const box=el("pageStatus"),[m,a]=await Promise.all([supabaseClient.from("choir_members").select("*").order("created_at",{ascending:false}),supabaseClient.from("choir_attendance").select("*").order("attendance_date",{ascending:false})]);if(m.error||a.error){box.textContent=(m.error||a.error).message;box.className="mb-4 text-sm font-bold text-red-600";return}members=m.data||[];attendance=a.data||[];box.textContent="";stats();render()}function today(){return new Date().toISOString().slice(0,10)}function stats(){el("totalMembers").textContent=members.length;el("activeMembers").textContent=members.filter(x=>x.status==="Active").length;el("totalLeaders").textContent=members.filter(x=>x.choir_role!=="Member"&&x.status==="Active").length;el("presentToday").textContent=new Set(attendance.filter(x=>x.attendance_date===today()&&["Present","Late"].includes(x.attendance_status)).map(x=>x.choir_member_id)).size}
function render(){const q=el("searchBox").value.toLowerCase(),voice=el("voiceFilter").value,st=el("statusFilter").value,items=members.filter(x=>(voice==="all"||x.voice_part===voice)&&(st==="all"||x.status===st)&&[x.choir_number,x.full_name,x.phone,x.voice_part,x.choir_role,x.instrument].join(" ").toLowerCase().includes(q));el("choirList").innerHTML=items.length?items.map(x=>{const latest=attendance.find(a=>a.choir_member_id===x.id);return `<article class="member-card"><div class="flex justify-between gap-3"><div><div class="flex gap-2"><span class="badge ${x.status==="Active"?"bg-green-100 text-green-700":"bg-slate-200 text-slate-600"}">${esc(x.status)}</span><span class="text-[9px] font-black text-slate-400">${esc(x.choir_number)}</span></div><h3 class="text-lg font-black mt-3">${esc(x.full_name)}</h3><p class="text-xs text-fuchsia-600 font-bold">${esc(x.voice_part)} · ${esc(x.choir_role)}</p></div>${latest&&latest.attendance_date===today()?`<span class="badge bg-blue-100 text-blue-700 h-fit">${esc(latest.attendance_status)}</span>`:""}</div><div class="mt-4 grid grid-cols-2 gap-3 text-xs"><p><span class="text-slate-400">Phone:</span><br><b>${esc(x.phone)}</b></p><p><span class="text-slate-400">Branch:</span><br><b>${esc(x.branch)}</b></p><p><span class="text-slate-400">Instrument:</span><br><b>${esc(x.instrument||"None")}</b></p><p><span class="text-slate-400">Joined:</span><br><b>${esc(x.joined_date)}</b></p></div>${x.availability?`<p class="mt-3 bg-fuchsia-50 text-fuchsia-700 rounded-xl p-3 text-xs"><b>Availability:</b> ${esc(x.availability)}</p>`:""}<div class="mt-4 flex flex-wrap gap-2"><button onclick="openAttendance('${x.id}')" class="btn bg-fuchsia-50 text-fuchsia-700">Attendance</button><button onclick="editMember('${x.id}')" class="btn bg-blue-50 text-blue-700">Edit</button><button onclick="setStatus('${x.id}','${x.status==="Active"?"On Leave":"Active"}')" class="btn bg-amber-50 text-amber-700">${x.status==="Active"?"Set Leave":"Activate"}</button><button onclick="deleteMember('${x.id}')" class="btn bg-red-50 text-red-700">Delete</button></div></article>`}).join(""):'<div class="panel lg:col-span-2 text-center text-slate-400 font-bold">No choir members found.</div>'}
async function saveMember(e){e.preventDefault();const payload={full_name:el("fullName").value.trim(),phone:el("phone").value.trim(),email:clean(el("email").value),voice_part:el("voicePart").value,choir_role:el("choirRole").value,instrument:clean(el("instrument").value),branch:el("branch").value,joined_date:el("joinedDate").value||today(),availability:clean(el("availability").value),emergency_contact:clean(el("emergencyContact").value),emergency_phone:clean(el("emergencyPhone").value),notes:clean(el("notes").value)},id=el("editingId").value,r=id?await supabaseClient.from("choir_members").update(payload).eq("id",id):await supabaseClient.from("choir_members").insert(payload);if(r.error)return show(r.error.message,false);show(id?"Choir member updated.":"Choir member registered.",true);resetForm();await loadAll()}function editMember(id){const x=members.find(v=>v.id===id);if(!x)return;el("editingId").value=x.id;el("fullName").value=x.full_name;el("phone").value=x.phone;el("email").value=x.email||"";el("voicePart").value=x.voice_part;el("choirRole").value=x.choir_role;el("instrument").value=x.instrument||"";el("branch").value=x.branch;el("joinedDate").value=x.joined_date;el("availability").value=x.availability||"";el("emergencyContact").value=x.emergency_contact||"";el("emergencyPhone").value=x.emergency_phone||"";el("notes").value=x.notes||"";el("saveBtn").innerHTML='<i class="fas fa-floppy-disk mr-2"></i>Update Member';scrollTo({top:0,behavior:"smooth"})}
function openAttendance(id){const x=members.find(v=>v.id===id);el("attendanceMemberId").value=id;el("attendanceMember").textContent=`Choir member: ${x.full_name} · ${x.voice_part}`;el("attendanceDate").value=today();el("attendanceNotes").value="";el("attendanceModal").classList.remove("hidden");el("attendanceModal").classList.add("flex")}function closeAttendance(){el("attendanceModal").classList.add("hidden");el("attendanceModal").classList.remove("flex")}async function saveAttendance(e){e.preventDefault();const {error}=await supabaseClient.from("choir_attendance").insert({choir_member_id:el("attendanceMemberId").value,attendance_date:el("attendanceDate").value,session_type:el("sessionType").value,attendance_status:el("attendanceStatus").value,notes:clean(el("attendanceNotes").value)});if(error)return alert(error.message);closeAttendance();await loadAll()}async function setStatus(id,status){const {error}=await supabaseClient.from("choir_members").update({status}).eq("id",id);if(error)return alert(error.message);await loadAll()}async function deleteMember(id){if(!confirm("Permanently delete this choir member and attendance history?"))return;const {error}=await supabaseClient.from("choir_members").delete().eq("id",id);if(error)return alert(error.message);await loadAll()}
function resetForm(){el("choirForm").reset();el("editingId").value="";el("voicePart").value="Not Assigned";el("choirRole").value="Member";el("branch").value="Okahandja HQ";el("joinedDate").value=today();el("saveBtn").innerHTML='<i class="fas fa-music mr-2"></i>Save Member'}function exportChoir(){const rows=[["Choir Number","Full Name","Phone","Email","Voice Part","Role","Instrument","Branch","Joined","Availability","Status"],...members.map(x=>[x.choir_number,x.full_name,x.phone,x.email,x.voice_part,x.choir_role,x.instrument,x.branch,x.joined_date,x.availability,x.status])],csv=rows.map(r=>r.map(v=>'"'+String(v??"").replaceAll('"','""')+'"').join(",")).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="sky-grace-choir-members.csv";a.click();URL.revokeObjectURL(a.href)}function show(m,ok){el("formStatus").textContent=m;el("formStatus").className=`rounded-xl p-3 text-sm font-bold ${ok?"bg-green-50 text-green-700":"bg-red-50 text-red-700"}`}function clean(v){v=String(v||"").trim();return v||null}function esc(v){return String(v||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
</script></body></html>
