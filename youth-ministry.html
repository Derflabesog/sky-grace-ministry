<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Youth Ministry | Sky Grace Admin</title><script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"></head><body class="bg-slate-50 flex min-h-screen"><div id="admin-sidebar-mount"></div><script src="admin-sidebar.js" defer></script><div class="flex-1 min-w-0"><header class="h-16 bg-white border-b px-8 flex items-center justify-between sticky top-0 z-30"><div><h1 class="font-black">Youth Ministry</h1><p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Connect, disciple and empower young people</p></div><button onclick="exportYouth()" class="btn bg-green-600 text-white"><i class="fas fa-file-csv mr-2"></i>Export CSV</button></header>
<main class="p-6 lg:p-8 max-w-[1600px] mx-auto"><section class="grid xl:grid-cols-[400px_1fr] gap-7 items-start"><form id="youthForm" class="panel space-y-5 xl:sticky xl:top-24"><input id="editingId" type="hidden"><div><h2 class="text-xl font-black">Register Youth Member</h2><p class="sub">Record contact, care, interests and leadership details.</p></div><div><label class="label">Full Name *</label><input id="fullName" required class="field"></div><div class="grid grid-cols-2 gap-4"><div><label class="label">Date of Birth *</label><input id="dateOfBirth" required type="date" class="field"></div><div><label class="label">Gender</label><select id="gender" class="field"><option value="">Not specified</option><option>Male</option><option>Female</option></select></div></div><div class="grid grid-cols-2 gap-4"><div><label class="label">Phone</label><input id="phone" class="field" placeholder="+264..."></div><div><label class="label">Email</label><input id="email" type="email" class="field"></div></div><div><label class="label">Branch *</label><select id="branch" class="field"><option>Okahandja HQ</option><option>Windhoek</option><option>Online</option><option>Other</option></select></div><div><label class="label">School / College / Work</label><input id="schoolWork" class="field"></div><div><label class="label">Ministry Interest</label><select id="ministryInterest" class="field"><option value="">Not specified</option><option>Worship & Music</option><option>Media & Technology</option><option>Prayer & Intercession</option><option>Evangelism</option><option>Drama & Creative Arts</option><option>Ushering</option><option>Community Outreach</option><option>Bible Study</option></select></div><div><label class="label">Skills and Talents</label><textarea id="skills" rows="2" class="field"></textarea></div><div><label class="label">Leadership Role</label><select id="leadershipRole" class="field"><option>Member</option><option>Youth Leader</option><option>Assistant Leader</option><option>Secretary</option><option>Worship Leader</option><option>Media Coordinator</option><option>Prayer Coordinator</option></select></div><div class="grid grid-cols-2 gap-4"><div><label class="label">Parent / Guardian</label><input id="guardianName" class="field"></div><div><label class="label">Guardian Phone</label><input id="guardianPhone" class="field"></div></div><div class="grid grid-cols-2 gap-4"><div><label class="label">Emergency Contact *</label><input id="emergencyName" required class="field"></div><div><label class="label">Emergency Phone *</label><input id="emergencyPhone" required class="field"></div></div><div><label class="label">Joined Date</label><input id="joinedDate" type="date" class="field"></div><div><label class="label">Notes</label><textarea id="notes" rows="2" class="field"></textarea></div><p id="formStatus" class="hidden rounded-xl p-3 text-sm font-bold"></p><div class="flex gap-3"><button id="saveBtn" class="btn bg-indigo-600 text-white flex-1"><i class="fas fa-user-plus mr-2"></i>Save Youth Member</button><button type="button" onclick="resetForm()" class="btn bg-slate-100 text-slate-600">Clear</button></div></form>
<div><section class="grid sm:grid-cols-4 gap-4 mb-5"><div class="stat"><small>Total Youth</small><strong id="totalYouth">0</strong></div><div class="stat"><small>Active</small><strong id="activeYouth" class="text-green-600">0</strong></div><div class="stat"><small>Leaders</small><strong id="leaders" class="text-indigo-600">0</strong></div><div class="stat"><small>Present Today</small><strong id="presentToday" class="text-orange-500">0</strong></div></section><div class="grid md:grid-cols-[1fr_190px_170px] gap-3 mb-4"><input id="searchBox" class="field" placeholder="Search name, phone, talent, interest..."><select id="interestFilter" class="field"><option value="all">All interests</option><option>Worship & Music</option><option>Media & Technology</option><option>Prayer & Intercession</option><option>Evangelism</option><option>Drama & Creative Arts</option><option>Ushering</option><option>Community Outreach</option><option>Bible Study</option></select><select id="statusFilter" class="field"><option value="all">All statuses</option><option>Active</option><option>Inactive</option><option>Graduated</option></select></div><p id="pageStatus" class="mb-4 text-sm font-bold text-slate-500">Loading youth members...</p><div id="youthList" class="grid lg:grid-cols-2 gap-4"></div></div></section></main></div>
<div id="attendanceModal" class="fixed inset-0 bg-slate-950/60 hidden items-center justify-center z-50 p-5"><form id="attendanceForm" class="bg-white rounded-3xl w-full max-w-lg p-7"><h2 class="text-2xl font-black">Record Attendance</h2><p id="attendanceMember" class="sub mt-1"></p><input id="attendanceYouthId" type="hidden"><div class="mt-5"><label class="label">Date *</label><input id="attendanceDate" required type="date" class="field"></div><div class="mt-4"><label class="label">Activity *</label><select id="activityName" class="field"><option>Youth Service</option><option>Bible Study</option><option>Prayer Meeting</option><option>Outreach</option><option>Rehearsal</option><option>Conference</option><option>Social Activity</option></select></div><div class="mt-4"><label class="label">Notes</label><textarea id="attendanceNotes" rows="2" class="field"></textarea></div><div class="flex gap-3 mt-6"><button class="btn bg-indigo-600 text-white flex-1">Record Present</button><button type="button" onclick="closeAttendance()" class="btn bg-slate-100">Cancel</button></div></form></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase.js"></script><script src="assets/js/guard.js"></script><style>.panel,.stat,.youth-card{background:#fff;border:1px solid #e2e8f0;border-radius:1rem;padding:1.25rem}.label,.stat small{display:block;margin-bottom:.4rem;font-size:.61rem;font-weight:900;text-transform:uppercase;letter-spacing:.1em;color:#94a3b8}.field{width:100%;background:#f8fafc;border:1px solid #e2e8f0;border-radius:.75rem;padding:.78rem .95rem;font-size:.78rem;font-weight:700}.btn{border-radius:.75rem;padding:.78rem 1rem;font-size:.67rem;font-weight:900;text-transform:uppercase;letter-spacing:.06em}.sub{font-size:.75rem;color:#64748b}.stat strong{display:block;font-size:1.5rem;margin-top:.4rem}.badge{padding:.35rem .65rem;border-radius:99px;font-size:.56rem;font-weight:900;text-transform:uppercase}</style>
<script>
let youth=[],attendance=[];const el=id=>document.getElementById(id);document.addEventListener("DOMContentLoaded",()=>{el("youthForm").onsubmit=saveYouth;el("attendanceForm").onsubmit=recordAttendance;el("searchBox").oninput=render;el("interestFilter").onchange=render;el("statusFilter").onchange=render;resetForm();loadAll()});async function loadAll(){const box=el("pageStatus"),[y,a]=await Promise.all([supabaseClient.from("youth_members").select("*").order("created_at",{ascending:false}),supabaseClient.from("youth_attendance").select("*").order("attendance_date",{ascending:false})]);if(y.error||a.error){box.textContent=(y.error||a.error).message;box.className="mb-4 text-sm font-bold text-red-600";return}youth=y.data||[];attendance=a.data||[];box.textContent="";stats();render()}function today(){return new Date().toISOString().slice(0,10)}function age(d){const b=new Date(d),n=new Date();let a=n.getFullYear()-b.getFullYear();if(n.getMonth()<b.getMonth()||(n.getMonth()===b.getMonth()&&n.getDate()<b.getDate()))a--;return a}
function stats(){el("totalYouth").textContent=youth.length;el("activeYouth").textContent=youth.filter(x=>x.status==="Active").length;el("leaders").textContent=youth.filter(x=>x.leadership_role!=="Member"&&x.status==="Active").length;el("presentToday").textContent=new Set(attendance.filter(x=>x.attendance_date===today()&&x.attended).map(x=>x.youth_id)).size}function render(){const q=el("searchBox").value.toLowerCase(),interest=el("interestFilter").value,st=el("statusFilter").value,items=youth.filter(x=>(interest==="all"||x.ministry_interest===interest)&&(st==="all"||x.status===st)&&[x.youth_number,x.full_name,x.phone,x.school_or_work,x.ministry_interest,x.skills_and_talents].join(" ").toLowerCase().includes(q));el("youthList").innerHTML=items.length?items.map(x=>{const present=attendance.some(a=>a.youth_id===x.id&&a.attendance_date===today()&&a.attended);return `<article class="youth-card"><div class="flex justify-between gap-3"><div><div class="flex gap-2"><span class="badge ${x.status==="Active"?"bg-green-100 text-green-700":"bg-slate-200 text-slate-600"}">${esc(x.status)}</span><span class="text-[9px] font-black text-slate-400">${esc(x.youth_number)}</span></div><h3 class="text-lg font-black mt-3">${esc(x.full_name)}</h3><p class="text-xs text-indigo-600 font-bold">${age(x.date_of_birth)} years · ${esc(x.leadership_role)}</p></div>${present?'<span class="badge bg-indigo-100 text-indigo-700 h-fit">Present Today</span>':''}</div><div class="mt-4 grid grid-cols-2 gap-3 text-xs"><p><span class="text-slate-400">Phone:</span><br><b>${esc(x.phone||"Not supplied")}</b></p><p><span class="text-slate-400">Branch:</span><br><b>${esc(x.branch)}</b></p><p><span class="text-slate-400">Interest:</span><br><b>${esc(x.ministry_interest||"Not specified")}</b></p><p><span class="text-slate-400">School / Work:</span><br><b>${esc(x.school_or_work||"Not recorded")}</b></p></div>${x.skills_and_talents?`<p class="mt-3 bg-indigo-50 text-indigo-700 rounded-xl p-3 text-xs"><b>Talents:</b> ${esc(x.skills_and_talents)}</p>`:""}<div class="mt-4 flex flex-wrap gap-2"><button onclick="openAttendance('${x.id}')" class="btn bg-indigo-50 text-indigo-700">Attendance</button><button onclick="editYouth('${x.id}')" class="btn bg-blue-50 text-blue-700">Edit</button><button onclick="setStatus('${x.id}','${x.status==="Active"?"Inactive":"Active"}')" class="btn bg-amber-50 text-amber-700">${x.status==="Active"?"Deactivate":"Activate"}</button><button onclick="deleteYouth('${x.id}')" class="btn bg-red-50 text-red-700">Delete</button></div></article>`}).join(""):'<div class="panel lg:col-span-2 text-center text-slate-400 font-bold">No youth members found.</div>'}
async function saveYouth(e){e.preventDefault();const payload={full_name:el("fullName").value.trim(),date_of_birth:el("dateOfBirth").value,gender:clean(el("gender").value),phone:clean(el("phone").value),email:clean(el("email").value),branch:el("branch").value,school_or_work:clean(el("schoolWork").value),ministry_interest:clean(el("ministryInterest").value),skills_and_talents:clean(el("skills").value),leadership_role:el("leadershipRole").value,parent_guardian_name:clean(el("guardianName").value),parent_guardian_phone:clean(el("guardianPhone").value),emergency_contact_name:el("emergencyName").value.trim(),emergency_contact_phone:el("emergencyPhone").value.trim(),joined_date:el("joinedDate").value||today(),notes:clean(el("notes").value)},id=el("editingId").value,r=id?await supabaseClient.from("youth_members").update(payload).eq("id",id):await supabaseClient.from("youth_members").insert(payload);if(r.error)return show(r.error.message,false);show(id?"Youth member updated.":"Youth member registered.",true);resetForm();await loadAll()}function editYouth(id){const x=youth.find(v=>v.id===id);if(!x)return;el("editingId").value=x.id;el("fullName").value=x.full_name;el("dateOfBirth").value=x.date_of_birth;el("gender").value=x.gender||"";el("phone").value=x.phone||"";el("email").value=x.email||"";el("branch").value=x.branch;el("schoolWork").value=x.school_or_work||"";el("ministryInterest").value=x.ministry_interest||"";el("skills").value=x.skills_and_talents||"";el("leadershipRole").value=x.leadership_role;el("guardianName").value=x.parent_guardian_name||"";el("guardianPhone").value=x.parent_guardian_phone||"";el("emergencyName").value=x.emergency_contact_name;el("emergencyPhone").value=x.emergency_contact_phone;el("joinedDate").value=x.joined_date;el("notes").value=x.notes||"";el("saveBtn").innerHTML='<i class="fas fa-floppy-disk mr-2"></i>Update Youth Member';scrollTo({top:0,behavior:"smooth"})}
function openAttendance(id){const x=youth.find(v=>v.id===id);el("attendanceYouthId").value=id;el("attendanceMember").textContent=`Member: ${x.full_name}`;el("attendanceDate").value=today();el("attendanceNotes").value="";el("attendanceModal").classList.remove("hidden");el("attendanceModal").classList.add("flex")}function closeAttendance(){el("attendanceModal").classList.add("hidden");el("attendanceModal").classList.remove("flex")}async function recordAttendance(e){e.preventDefault();const {error}=await supabaseClient.from("youth_attendance").insert({youth_id:el("attendanceYouthId").value,attendance_date:el("attendanceDate").value,activity_name:el("activityName").value,notes:clean(el("attendanceNotes").value)});if(error)return alert(error.message);closeAttendance();await loadAll()}async function setStatus(id,status){const {error}=await supabaseClient.from("youth_members").update({status}).eq("id",id);if(error)return alert(error.message);await loadAll()}async function deleteYouth(id){if(!confirm("Permanently delete this youth member and attendance history?"))return;const {error}=await supabaseClient.from("youth_members").delete().eq("id",id);if(error)return alert(error.message);await loadAll()}
function resetForm(){el("youthForm").reset();el("editingId").value="";el("branch").value="Okahandja HQ";el("leadershipRole").value="Member";el("joinedDate").value=today();el("saveBtn").innerHTML='<i class="fas fa-user-plus mr-2"></i>Save Youth Member'}function exportYouth(){const rows=[["Youth Number","Full Name","DOB","Age","Gender","Phone","Email","Branch","School or Work","Ministry Interest","Skills","Leadership Role","Emergency Contact","Emergency Phone","Joined","Status"],...youth.map(x=>[x.youth_number,x.full_name,x.date_of_birth,age(x.date_of_birth),x.gender,x.phone,x.email,x.branch,x.school_or_work,x.ministry_interest,x.skills_and_talents,x.leadership_role,x.emergency_contact_name,x.emergency_contact_phone,x.joined_date,x.status])],csv=rows.map(r=>r.map(v=>'"'+String(v??"").replaceAll('"','""')+'"').join(",")).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="sky-grace-youth-ministry.csv";a.click();URL.revokeObjectURL(a.href)}function show(m,ok){el("formStatus").textContent=m;el("formStatus").className=`rounded-xl p-3 text-sm font-bold ${ok?"bg-green-50 text-green-700":"bg-red-50 text-red-700"}`}function clean(v){v=String(v||"").trim();return v||null}function esc(v){return String(v||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
</script></body></html>
